<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Màn Hình Tiếp Nhận Đơn Tại Quầy</title>
  <style>
    :root {
      --bg: #eef2f6;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #cbd5e1;
      --new: #dc2626;
      --prep: #d97706;
      --done: #16a34a;
      --primary: #0f172a;
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      margin: 0;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
    }

    .topbar {
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #fff;
      padding: 16px 18px;
      border-radius: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 14px;
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.14);
    }

    .topbar-left h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 800;
    }

    .topbar-sub {
      font-size: 13px;
      opacity: 0.8;
      margin-top: 4px;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(255, 255, 255, 0.12);
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #22c55e;
    }

    .btn {
      border: none;
      border-radius: 10px;
      padding: 9px 14px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.12s ease, opacity 0.15s ease;
    }

    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }

    .btn-sound {
      background: #f59e0b;
      color: #111827;
    }

    .btn-clear {
      background: #ef4444;
      color: #fff;
    }

    .support-alerts {
      margin-bottom: 14px;
      display: grid;
      gap: 10px;
    }

    .support-banner {
      background: #fef2f2;
      border: 2px solid #dc2626;
      border-left: 8px solid #dc2626;
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      box-shadow: 0 4px 12px rgba(220, 38, 38, 0.14);
      animation: pulseAlert 1.4s infinite;
    }

    @keyframes pulseAlert {
      0%, 100% { box-shadow: 0 4px 12px rgba(220, 38, 38, 0.14); }
      50% { box-shadow: 0 4px 20px rgba(220, 38, 38, 0.34); }
    }

    .support-title {
      font-weight: 800;
      color: #991b1b;
      font-size: 16px;
    }

    .support-message-text {
      margin-top: 5px;
      font-size: 15px;
      font-weight: 700;
      color: #111827;
      background: #ffffff;
      border: 1px solid #fecaca;
      border-radius: 8px;
      padding: 7px 10px;
    }

    .support-time {
      font-size: 12px;
      color: #7f1d1d;
      margin-top: 5px;
    }

    .btn-ack {
      background: #16a34a;
      color: #fff;
      border: none;
      border-radius: 9px;
      padding: 9px 14px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
    }

    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .filter-btn {
      background: #fff;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 14px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .filter-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .orders-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 14px;
    }

    .order-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-top: 5px solid var(--new);
      border-radius: 14px;
      padding: 14px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
    }

    .order-card.preparing { border-top-color: var(--prep); }
    .order-card.done { border-top-color: var(--done); opacity: 0.86; }

    .order-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      border-bottom: 1px dashed #e2e8f0;
      padding-bottom: 10px;
    }

    .table-badge {
      font-size: 18px;
      font-weight: 800;
      color: #0f172a;
    }

    .order-time {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }

    .state-badge {
      font-size: 12px;
      font-weight: 800;
      padding: 5px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .state-new { background: #fee2e2; color: #991b1b; }
    .state-preparing { background: #fef3c7; color: #92400e; }
    .state-done { background: #dcfce7; color: #166534; }

    .item-row {
      padding: 6px 0;
      border-bottom: 1px solid #f1f5f9;
      font-size: 14px;
    }

    .item-main {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-weight: 600;
    }

    .item-note {
      font-size: 12px;
      color: #b45309;
      background: #fffbeb;
      border-left: 3px solid #f59e0b;
      padding: 4px 8px;
      border-radius: 6px;
      margin-top: 4px;
      font-weight: 600;
    }

    .order-note {
      margin-top: 10px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 9px;
      padding: 8px 10px;
      font-size: 13px;
      color: #334155;
    }

    .order-total {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 16px;
      font-weight: 800;
      padding-top: 8px;
      border-top: 1px dashed #cbd5e1;
    }

    .order-total span:last-child {
      color: #16a34a;
      font-size: 18px;
    }

    .order-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .btn-prep {
      background: #f59e0b;
      color: #111827;
    }

    .btn-done {
      background: #16a34a;
      color: #fff;
    }

    .empty {
      background: #fff;
      border: 1px dashed var(--border);
      border-radius: 14px;
      padding: 36px 16px;
      text-align: center;
      color: var(--muted);
      font-size: 15px;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-left">
      <h1>MÀN HÌNH TIẾP NHẬN ĐƠN TẠI QUẦY</h1>
      <div id="conn-status" class="topbar-sub">Đang kết nối dữ liệu thời gian thực...</div>
    </div>
    <div class="topbar-right">
      <div class="status-pill">
        <span class="dot"></span>
        <span id="count-summary">0 đơn mới</span>
      </div>
      <button id="btn-sound" class="btn btn-sound" onclick="toggleSound()">Âm thanh: BẬT</button>
      <button class="btn btn-clear" onclick="clearDoneOrders()">Xóa đơn đã xong</button>
    </div>
  </div>

  <div id="support-alerts" class="support-alerts"></div>

  <div class="filters">
    <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">Tất cả (<span id="f-all">0</span>)</button>
    <button class="filter-btn" data-filter="new" onclick="setFilter('new')">Đơn mới (<span id="f-new">0</span>)</button>
    <button class="filter-btn" data-filter="preparing" onclick="setFilter('preparing')">Đang làm (<span id="f-preparing">0</span>)</button>
    <button class="filter-btn" data-filter="done" onclick="setFilter('done')">Đã xong (<span id="f-done">0</span>)</button>
  </div>

  <div id="orders-container" class="orders-grid"></div>

  <script>
    let allOrders = [];
    let allCalls = [];
    let activeFilter = "all";
    let soundEnabled = true;
    let knownOrderIds = new Set();
    let knownCallIds = new Set();
    let isFirstLoad = true;
    let audioCtx = null;

    function playAlertBeep(kind) {
      if (!soundEnabled) return;
      try {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          audioCtx = new AudioContextClass();
        }
        if (audioCtx.state === "suspended") {
          audioCtx.resume();
        }
        const now = audioCtx.currentTime;
        const notes = kind === "call" ? [880, 1174.66, 880] : [587.33, 783.99];
        notes.forEach(function(freq, idx) {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = "triangle";
          osc.frequency.setValueAtTime(freq, now + idx * 0.14);
          gain.gain.setValueAtTime(0.18, now + idx * 0.14);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.14 + 0.13);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + idx * 0.14);
          osc.stop(now + idx * 0.14 + 0.14);
        });
      } catch (_) {}
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      document.getElementById("btn-sound").innerText = "Âm thanh: " + (soundEnabled ? "BẬT" : "TẮT");
      if (soundEnabled) playAlertBeep("order");
    }

    function formatTime(ts) {
      if (!ts) return "";
      const d = new Date(ts);
      return d.toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
    }

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function setFilter(filter) {
      activeFilter = filter;
      document.querySelectorAll(".filter-btn").forEach(function(btn) {
        btn.classList.toggle("active", btn.dataset.filter === filter);
      });
      renderOrders();
    }

    function renderSupportCalls() {
      const box = document.getElementById("support-alerts");
      const pendingCalls = allCalls.filter(function(c) { return c.status !== "handled"; });

      if (pendingCalls.length === 0) {
        box.innerHTML = "";
        return;
      }

      box.innerHTML = pendingCalls.map(function(c) {
        const tableNum = escapeHtml(c.table || "?");
        const noteText = (c.note || "").trim();
        const rawMsg = (c.message || "").trim();
        const displayText = rawMsg
          ? rawMsg
          : (noteText ? "Bàn " + tableNum + " cần hỗ trợ: " + noteText : "Bàn " + tableNum + " cần hỗ trợ");

        return (
          '<div class="support-banner">' +
            '<div>' +
              '<div class="support-title">BÀN ' + tableNum + ' ĐANG GỌI NHÂN VIÊN HỖ TRỢ!</div>' +
              '<div class="support-message-text">Nội dung cần hỗ trợ: ' + escapeHtml(displayText) + '</div>' +
              '<div class="support-time">Lúc ' + formatTime(c.createdAt) + '</div>' +
            '</div>' +
            '<button class="btn-ack" onclick="ackCall(\'' + c.id + '\')">Đã hỗ trợ</button>' +
          '</div>'
        );
      }).join("");
    }

    function renderOrders() {
      const container = document.getElementById("orders-container");
      const newCount = allOrders.filter(function(o) { return o.status === "new"; }).length;
      const prepCount = allOrders.filter(function(o) { return o.status === "preparing"; }).length;
      const doneCount = allOrders.filter(function(o) { return o.status === "done"; }).length;

      document.getElementById("f-all").innerText = allOrders.length;
      document.getElementById("f-new").innerText = newCount;
      document.getElementById("f-preparing").innerText = prepCount;
      document.getElementById("f-done").innerText = doneCount;
      document.getElementById("count-summary").innerText = newCount + " đơn mới";

      const filtered = activeFilter === "all"
        ? allOrders
        : allOrders.filter(function(o) { return o.status === activeFilter; });

      if (filtered.length === 0) {
        container.innerHTML = '<div class="empty">Chưa có đơn hàng nào trong mục này.</div>';
        return;
      }

      container.innerHTML = filtered.map(function(order) {
        const status = order.status || "new";
        const stateText = status === "new" ? "ĐƠN MỚI" : status === "preparing" ? "ĐANG LÀM" : "ĐÃ XONG";
        const stateClass = status === "new" ? "state-new" : status === "preparing" ? "state-preparing" : "state-done";
        const items = Array.isArray(order.items) ? order.items : [];

        const isTakeaway = order.orderType === "Mang về" || String(order.table || "").toLowerCase() === "mang về";
        const tableDisplay = isTakeaway ? "MANG VỀ" : "BÀN " + escapeHtml(order.table || "?");

        const itemsHtml = items.map(function(item) {
          const lineTotal = (Number(item.price) || 0) * (Number(item.qty) || 0);
          const noteHtml = item.note
            ? '<div class="item-note">Ghi chú món: ' + escapeHtml(item.note) + '</div>'
            : "";
          return (
            '<div class="item-row">' +
              '<div class="item-main">' +
                '<span>' + escapeHtml(item.qty) + 'x ' + escapeHtml(item.name) + '</span>' +
                '<span>' + lineTotal.toLocaleString("vi-VN") + 'đ</span>' +
              '</div>' +
              noteHtml +
            '</div>'
          );
        }).join("");

        const noteHtml = order.note
          ? '<div class="order-note"><strong>Ghi chú chung:</strong> ' + escapeHtml(order.note) + '</div>'
          : "";

        return (
          '<div class="order-card ' + status + '">' +
            '<div>' +
              '<div class="order-head">' +
                '<div>' +
                  '<div class="table-badge">' + tableDisplay + '</div>' +
                  '<div class="order-time">Đặt lúc ' + formatTime(order.createdAt) + '</div>' +
                '</div>' +
                '<span class="state-badge ' + stateClass + '">' + stateText + '</span>' +
              '</div>' +
              '<div style="margin-top:8px;">' + itemsHtml + '</div>' +
              noteHtml +
            '</div>' +
            '<div>' +
              '<div class="order-total">' +
                '<span>Tổng tiền:</span>' +
                '<span>' + Number(order.total || 0).toLocaleString("vi-VN") + 'đ</span>' +
              '</div>' +
              '<div class="order-actions" style="margin-top:10px;">' +
                '<button class="btn btn-prep" ' + (status === "preparing" ? "disabled" : "") + ' onclick="updateOrderStatus(\'' + order.id + '\', \'preparing\')">Đang làm</button>' +
                '<button class="btn btn-done" ' + (status === "done" ? "disabled" : "") + ' onclick="updateOrderStatus(\'' + order.id + '\', \'done\')">Hoàn thành</button>' +
              '</div>' +
            '</div>' +
          '</div>'
        );
      }).join("");
    }

    window.__onOrdersSnapshot = function(ordersList) {
      ordersList.sort(function(a, b) {
        if (a.status === "new" && b.status !== "new") return -1;
        if (a.status !== "new" && b.status === "new") return 1;
        return (b.createdAt || 0) - (a.createdAt || 0);
      });

      let hasBrandNewOrder = false;
      const currentIds = new Set();
      ordersList.forEach(function(o) {
        currentIds.add(o.id);
        if (!isFirstLoad && !knownOrderIds.has(o.id) && o.status === "new") {
          hasBrandNewOrder = true;
        }
      });
      knownOrderIds = currentIds;
      allOrders = ordersList;
      renderOrders();
      if (hasBrandNewOrder) playAlertBeep("order");
    };

    window.__onCallsSnapshot = function(callsList) {
      callsList.sort(function(a, b) { return (b.createdAt || 0) - (a.createdAt || 0); });

      let hasBrandNewCall = false;
      const currentIds = new Set();
      callsList.forEach(function(c) {
        currentIds.add(c.id);
        if (!isFirstLoad && !knownCallIds.has(c.id) && c.status !== "handled") {
          hasBrandNewCall = true;
        }
      });
      knownCallIds = currentIds;
      allCalls = callsList;
      renderSupportCalls();
      if (hasBrandNewCall) playAlertBeep("call");
      isFirstLoad = false;
    };

    async function updateOrderStatus(orderId, nextStatus) {
      if (typeof window.__setOrderStatus !== "function") return;
      try {
        await window.__setOrderStatus(orderId, nextStatus);
      } catch (err) {
        alert("Lỗi cập nhật trạng thái: " + err.message);
      }
    }

    async function ackCall(callId) {
      if (typeof window.__ackSupportCall !== "function") return;
      try {
        await window.__ackSupportCall(callId);
      } catch (err) {
        alert("Lỗi xác nhận hỗ trợ: " + err.message);
      }
    }

    async function clearDoneOrders() {
      const doneList = allOrders.filter(function(o) { return o.status === "done"; });
      if (doneList.length === 0) {
        alert("Không có đơn đã xong nào để xóa.");
        return;
      }
      if (!confirm("Xóa " + doneList.length + " đơn đã hoàn thành khỏi màn hình quầy?")) return;
      if (typeof window.__deleteOrder !== "function") return;
      try {
        await Promise.all(doneList.map(function(o) { return window.__deleteOrder(o.id); }));
      } catch (err) {
        alert("Lỗi xóa đơn: " + err.message);
      }
    }
  </script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBghiBbYsyo7F5AjWgcQqcCXyoVHi5nVz8",
      authDomain: "mohinhquan.firebaseapp.com",
      databaseURL: "https://mohinhquan-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "mohinhquan",
      storageBucket: "mohinhquan.firebasestorage.app",
      messagingSenderId: "557675172063",
      appId: "1:557675172063:web:baf9433c28328878dbd96a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const statusEl = document.getElementById("conn-status");

    onValue(ref(db, ".info/connected"), function(snap) {
      statusEl.innerText = snap.val()
        ? "Đã kết nối trực tiếp tới quầy (Realtime)"
        : "Mất kết nối mạng, đang thử kết nối lại...";
    });

    onValue(ref(db, "orders"), function(snapshot) {
      const val = snapshot.val() || {};
      const list = Object.keys(val).map(function(id) {
        return Object.assign({ id: id }, val[id]);
      });
      window.__onOrdersSnapshot(list);
    });

    onValue(ref(db, "staffCalls"), function(snapshot) {
      const val = snapshot.val() || {};
      const list = Object.keys(val).map(function(id) {
        return Object.assign({ id: id }, val[id]);
      });
      window.__onCallsSnapshot(list);
    });

    window.__setOrderStatus = function(orderId, nextStatus) {
      return update(ref(db, "orders/" + orderId), { status: nextStatus });
    };

    window.__ackSupportCall = function(callId) {
      return update(ref(db, "staffCalls/" + callId), { status: "handled", handledAt: Date.now() });
    };

    window.__deleteOrder = function(orderId) {
      return remove(ref(db, "orders/" + orderId));
    };
  </script>
</body>
</html>
