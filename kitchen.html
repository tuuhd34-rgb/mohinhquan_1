<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quầy Tiếp Nhận Đơn</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 16px; background: #0f172a; color: #f8fafc; }
    .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
    .top-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .sound-btn { padding: 10px 14px; border: none; border-radius: 8px; background: #38bdf8; color: #082f49; font-weight: bold; cursor: pointer; }
    .sound-btn:hover { background: #0ea5e9; }
    .mute-btn { padding: 10px 14px; border: none; border-radius: 8px; background: #f97316; color: #fff; font-weight: bold; cursor: pointer; display: none; }
    .mute-btn.ringing { display: inline-block; animation: pulseBtn 1s infinite; }
    @keyframes pulseBtn { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }

    .revenue-btn { padding: 10px 14px; border: none; border-radius: 8px; background: #facc15; color: #422006; font-weight: bold; cursor: pointer; }
    .revenue-btn:hover { background: #eab308; }
    .lock-btn { padding: 7px 12px; border: 1px solid #475569; border-radius: 6px; background: #1e293b; color: #e2e8f0; font-weight: bold; cursor: pointer; font-size: 13px; }
    .lock-btn:hover { background: #334155; }

    #error-box { display: none; background: #7f1d1d; border: 1px solid #ef4444; color: #fecaca; padding: 10px 12px; border-radius: 8px; margin-bottom: 14px; font-size: 13px; white-space: pre-wrap; }

    #revenue-section { display: none; background: #131c31; border: 1px solid #ca8a04; border-radius: 12px; padding: 16px; margin-bottom: 20px; }
    #revenue-section.unlocked { display: block; }
    .revenue-header { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
    .revenue-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
    .revenue-card { background: #1e293b; border-radius: 10px; padding: 14px; border-left: 4px solid #facc15; }
    .revenue-card.month { border-left-color: #38bdf8; }
    .revenue-label { font-size: 13px; color: #94a3b8; margin-bottom: 6px; }
    .revenue-amount { font-size: 22px; font-weight: bold; color: #f8fafc; }
    .revenue-sub { font-size: 12px; color: #cbd5e1; margin-top: 4px; }
    .month-select { background: #0f172a; color: #f8fafc; border: 1px solid #475569; border-radius: 6px; padding: 5px 8px; font-size: 13px; margin-top: 8px; }

    .section-title { font-size: 16px; font-weight: bold; margin: 20px 0 12px 0; padding-bottom: 8px; border-bottom: 1px solid #334155; display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
    .section-left { display: flex; align-items: center; gap: 8px; }
    .count-pill { background: #334155; color: #f8fafc; padding: 2px 8px; border-radius: 99px; font-size: 13px; }
    .count-pill.active { background: #22c55e; color: #052e16; }

    .btn-add-folder { padding: 6px 12px; border: none; border-radius: 6px; background: #3b82f6; color: #fff; font-size: 13px; font-weight: bold; cursor: pointer; }
    .btn-add-folder:hover { background: #2563eb; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; }
    .order-card { background: #1e293b; border-left: 5px solid #22c55e; border-radius: 10px; padding: 14px; display: flex; flex-direction: column; justify-content: space-between; }
    .order-card.unacked { border: 2px solid #facc15; border-left: 6px solid #facc15; box-shadow: 0 0 16px rgba(250, 204, 21, 0.25); }
    .order-card.done { border-left-color: #64748b; opacity: 0.78; background: #162032; }

    .badge { display: inline-block; padding: 3px 8px; border-radius: 6px; font-size: 12px; font-weight: bold; background: #22c55e; color: #052e16; }
    .badge.unacked-badge { background: #facc15; color: #422006; margin-left: 4px; }
    .done .badge { background: #64748b; color: #fff; }

    .mode-tag { display: inline-block; margin-left: 6px; padding: 2px 7px; border-radius: 5px; font-size: 11px; font-weight: bold; background: #334155; color: #e2e8f0; vertical-align: middle; }
    .item-note { color: #7dd3fc; font-size: 12px; margin-top: 2px; }
    .order-note { color: #fde047; font-size: 13px; margin-bottom: 8px; padding: 6px 8px; background: rgba(253, 224, 71, 0.08); border-radius: 6px; }

    .actions { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px; }
    .actions button { flex: 1; min-width: 120px; padding: 9px 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; }
    .btn-ack { background: #facc15; color: #422006; }
    .btn-ack:hover { background: #eab308; }
    .btn-done { background: #22c55e; color: #052e16; }
    .btn-done:hover { background: #16a34a; }
    .btn-undo { background: #334155; color: #cbd5e1; }
    .btn-undo:hover { background: #475569; }
    .empty-msg { color: #64748b; font-style: italic; font-size: 14px; padding: 10px 0; grid-column: 1 / -1; }

    .day-folder { background: #131c31; border: 1px solid #293548; border-radius: 12px; padding: 14px; margin-bottom: 14px; }
    .day-header { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; cursor: pointer; user-select: none; }
    .day-header:hover .day-title-text { color: #38bdf8; }
    .day-title { font-size: 15px; font-weight: bold; color: #e2e8f0; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .day-meta { font-size: 13px; color: #94a3b8; font-weight: normal; }
    .day-controls { display: flex; gap: 8px; align-items: center; }
    .btn-toggle { padding: 6px 11px; border: 1px solid #334155; border-radius: 6px; background: #1e293b; color: #e2e8f0; cursor: pointer; font-size: 13px; font-weight: bold; }
    .btn-toggle:hover { background: #334155; }
    .btn-delete-day { padding: 6px 11px; border: none; border-radius: 6px; background: #dc2626; color: #fff; cursor: pointer; font-size: 13px; font-weight: bold; }
    .btn-delete-day:hover { background: #b91c1c; }

    .day-orders { margin-top: 12px; display: none; }
    .day-orders.is-open { display: grid; }
  </style>
</head>
<body>
  <div id="error-box"></div>

  <div class="top">
    <div>
      <h2 style="margin:0;">QUẦY TIẾP NHẬN ĐƠN</h2>
      <div id="today-label" style="font-size:13px; color:#94a3b8; margin-top:4px;"></div>
    </div>
    <div class="top-actions">
      <button type="button" id="btn-mute-alert" class="mute-btn">🔇 Đang kêu... (Bấm dừng)</button>
      <button type="button" id="btn-revenue" class="revenue-btn">💰 Doanh thu</button>
      <button type="button" id="btn-sound" class="sound-btn">🔔 Bật chuông báo đơn</button>
    </div>
  </div>

  <!-- Mục Doanh Thu (yêu cầu mật khẩu 9999) -->
  <div id="revenue-section">
    <div class="revenue-header">
      <div style="font-size:16px; font-weight:bold; color:#fde047;">💰 BÁO CÁO DOANH THU</div>
      <button type="button" id="btn-lock-revenue" class="lock-btn">🔒 Khóa lại</button>
    </div>
    <div class="revenue-grid">
      <div class="revenue-card">
        <div id="rev-today-label" class="revenue-label">Doanh thu hôm nay</div>
        <div id="rev-today-amount" class="revenue-amount">0đ</div>
        <div id="rev-today-count" class="revenue-sub">0 đơn</div>
      </div>
      <div class="revenue-card month">
        <div id="rev-month-label" class="revenue-label">Doanh thu tháng</div>
        <div id="rev-month-amount" class="revenue-amount">0đ</div>
        <div id="rev-month-count" class="revenue-sub">0 đơn</div>
        <select id="month-selector" class="month-select" aria-label="Chọn tháng xem doanh thu"></select>
      </div>
    </div>
  </div>

  <div class="section-title">
    <div class="section-left">
      <span>🟢 ĐƠN MỚI (HÔM NAY)</span>
      <span id="new-count" class="count-pill active">0</span>
    </div>
  </div>
  <div id="new-orders-grid" class="grid"></div>

  <div class="section-title" style="margin-top: 28px;">
    <div class="section-left">
      <span>⚪ ĐÃ XONG (HÔM NAY)</span>
      <span id="done-count" class="count-pill">0</span>
    </div>
  </div>
  <div id="done-orders-grid" class="grid"></div>

  <div class="section-title" style="margin-top: 34px;">
    <div class="section-left">
      <span>📁 THƯ MỤC ĐƠN THEO NGÀY</span>
      <span id="archive-days-count" class="count-pill">0 ngày</span>
    </div>
    <button type="button" id="btn-add-folder" class="btn-add-folder">➕ Tạo thư mục ngày</button>
  </div>
  <div id="archive-days-container"></div>

  <script>
    (function () {
      const REVENUE_PIN = "9999";
      const ALERT_PHRASE = "Có đơn mới, có đơn mới";
      const errorBox = document.getElementById("error-box");

      function showError(msg) {
        if (!errorBox) return;
        errorBox.style.display = "block";
        errorBox.textContent = msg;
      }

      window.addEventListener("error", (e) => {
        showError("Lỗi trang: " + (e.message || e.error || "Không xác định"));
      });

      window.addEventListener("unhandledrejection", (e) => {
        const reason = e.reason && e.reason.message ? e.reason.message : String(e.reason || "Lỗi tải dữ liệu");
        showError("Lỗi kết nối: " + reason);
      });

      let soundEnabled = false;
      let alertLoopTimer = null;
      let revenueUnlocked = false;
      let selectedMonthKey = null;
      let latestOrdersData = {};
      const expandedDays = new Set();
      const customFolders = new Set();

      // Lưu trạng thái đã bấm "Xác nhận đơn mới" theo từng orderId (kèm localStorage để không bị kêu lại khi reload)
      const STORAGE_ACK_KEY = "kitchen_acked_orders_v1";
      const acknowledgedOrderIds = new Set(
        JSON.parse(localStorage.getItem(STORAGE_ACK_KEY) || "[]")
      );

      function saveAckIds() {
        try {
          localStorage.setItem(STORAGE_ACK_KEY, JSON.stringify(Array.from(acknowledgedOrderIds)));
        } catch (_) {}
      }

      function getDateKeyByOffset(offsetDays = 0) {
        const d = new Date();
        d.setDate(d.getDate() + offsetDays);
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, "0");
        const day = String(d.getDate()).padStart(2, "0");
        return `${y}-${m}-${day}`;
      }

      function getDateKey(ts) {
        const d = ts ? new Date(ts) : new Date();
        if (Number.isNaN(d.getTime())) return getDateKeyByOffset(0);
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, "0");
        const day = String(d.getDate()).padStart(2, "0");
        return `${y}-${m}-${day}`;
      }

      function getMonthKey(ts) {
        const d = ts ? new Date(ts) : new Date();
        if (Number.isNaN(d.getTime())) return getMonthKey(Date.now());
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, "0");
        return `${y}-${m}`;
      }

      function formatDateVN(dateKey) {
        const parts = String(dateKey || "").split("-");
        if (parts.length !== 3) return dateKey;
        const [y, m, d] = parts;
        return `${d}/${m}/${y}`;
      }

      function formatMonthVN(monthKey) {
        const parts = String(monthKey || "").split("-");
        if (parts.length !== 2) return monthKey;
        const [y, m] = parts;
        return `Tháng ${m}/${y}`;
      }

      function escapeHtml(str = "") {
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function playChime() {
        try {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          const ctx = new AudioCtx();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "triangle";
          osc.frequency.setValueAtTime(920, ctx.currentTime);
          gain.gain.setValueAtTime(0.18, ctx.currentTime);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.22);
        } catch (_) {}
      }

      function speakNewOrderAlert() {
        if (!soundEnabled) return;
        playChime();
        try {
          if ("speechSynthesis" in window) {
            window.speechSynthesis.cancel();
            const utter = new SpeechSynthesisUtterance(ALERT_PHRASE);
            utter.lang = "vi-VN";
            utter.rate = 1.05;
            utter.pitch = 1.05;
            const voices = window.speechSynthesis.getVoices();
            const viVoice = voices.find(v => /vi/i.test(v.lang));
            if (viVoice) utter.voice = viVoice;
            window.speechSynthesis.speak(utter);
          }
        } catch (_) {}
      }

      function getUnacknowledgedNewOrders(data) {
        return Object.entries(data || {})
          .map(([id, val]) => ({ id, ...(val || {}) }))
          .filter(o => o.status !== "done" && !acknowledgedOrderIds.has(o.id));
      }

      function syncAlertLoop() {
        const unacked = getUnacknowledgedNewOrders(latestOrdersData);
        const muteBtn = document.getElementById("btn-mute-alert");

        if (unacked.length > 0 && soundEnabled) {
          muteBtn.classList.add("ringing");
          muteBtn.textContent = `🔇 Đang kêu (${unacked.length} đơn chưa xác nhận) — Bấm dừng`;
          if (!alertLoopTimer) {
            speakNewOrderAlert();
            alertLoopTimer = setInterval(() => {
              const currentUnacked = getUnacknowledgedNewOrders(latestOrdersData);
              if (currentUnacked.length === 0 || !soundEnabled) {
                stopAlertLoop();
                return;
              }
              speakNewOrderAlert();
            }, 4200);
          }
        } else {
          stopAlertLoop();
        }
      }

      function stopAlertLoop() {
        if (alertLoopTimer) {
          clearInterval(alertLoopTimer);
          alertLoopTimer = null;
        }
        try {
          if ("speechSynthesis" in window) {
            window.speechSynthesis.cancel();
          }
        } catch (_) {}
        const muteBtn = document.getElementById("btn-mute-alert");
        if (muteBtn) muteBtn.classList.remove("ringing");
      }

      function renderRevenue(list) {
        const now = Date.now();
        const todayKey = getDateKey(now);
        const currentMonthKey = getMonthKey(now);

        const monthSet = new Set([currentMonthKey]);
        for (const o of list) {
          monthSet.add(getMonthKey((o.createdAt || o.completedAt) || now));
        }
        const sortedMonths = Array.from(monthSet).sort((a, b) => b.localeCompare(a));

        if (!selectedMonthKey || !monthSet.has(selectedMonthKey)) {
          selectedMonthKey = currentMonthKey;
        }

        const selectEl = document.getElementById("month-selector");
        selectEl.innerHTML = sortedMonths
          .map(mk => `<option value="${escapeHtml(mk)}" ${mk === selectedMonthKey ? "selected" : ""}>${escapeHtml(formatMonthVN(mk))}</option>`)
          .join("");

        const todayOrders = list.filter(o => getDateKey((o.createdAt || o.completedAt) || now) === todayKey);
        const monthOrders = list.filter(o => getMonthKey((o.createdAt || o.completedAt) || now) === selectedMonthKey);

        const todayTotal = todayOrders.reduce((sum, o) => sum + (Number(o.total) || 0), 0);
        const monthTotal = monthOrders.reduce((sum, o) => sum + (Number(o.total) || 0), 0);

        document.getElementById("rev-today-label").textContent = `Doanh thu hôm nay (${formatDateVN(todayKey)})`;
        document.getElementById("rev-today-amount").textContent = `${todayTotal.toLocaleString("vi-VN")}đ`;
        document.getElementById("rev-today-count").textContent = `${todayOrders.length} đơn`;

        document.getElementById("rev-month-label").textContent = `Doanh thu ${formatMonthVN(selectedMonthKey)}`;
        document.getElementById("rev-month-amount").textContent = `${monthTotal.toLocaleString("vi-VN")}đ`;
        document.getElementById("rev-month-count").textContent = `${monthOrders.length} đơn`;
      }

      function renderOrderCard(o) {
        const isDone = o.status === "done";
        const isUnackedNew = !isDone && !acknowledgedOrderIds.has(o.id);
        const tableText = escapeHtml(o.table || "Mang về");
        const modeText = o.orderType ? `<span class="mode-tag">${escapeHtml(o.orderType)}</span>` : "";
        const timeText = o.createdAt
          ? new Date(o.createdAt).toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit" })
          : "";

        const itemsHtml = (o.items || []).map(i => `
          <li style="margin-bottom:6px;">
            <div><strong>${escapeHtml(i.qty)}x</strong> ${escapeHtml(i.name)}</div>
            ${i.note ? `<div class="item-note">↳ Ghi chú món: ${escapeHtml(i.note)}</div>` : ""}
          </li>
        `).join("");

        return `
          <div class="order-card ${isDone ? "done" : "new"} ${isUnackedNew ? "unacked" : ""}">
            <div>
              <div style="display:flex; justify-content:space-between; align-items:center; gap:6px; flex-wrap:wrap;">
                <div>
                  <strong style="font-size:18px;">Bàn: ${tableText}</strong>
                  ${modeText}
                </div>
                <div>
                  <span class="badge">${isDone ? "ĐÃ XONG" : "ĐƠN MỚI"}</span>
                  ${isUnackedNew ? `<span class="badge unacked-badge">CHƯA XÁC NHẬN</span>` : ""}
                </div>
              </div>
              ${timeText ? `<div style="font-size:12px; color:#94a3b8; margin-top:4px;">Lúc ${timeText}</div>` : ""}
              <ul style="padding-left:18px; margin:10px 0;">
                ${itemsHtml}
              </ul>
              ${o.note ? `<div class="order-note">Ghi chú đơn: ${escapeHtml(o.note)}</div>` : ""}
            </div>

            <div>
              <div style="font-weight:bold;">Tổng: ${(Number(o.total) || 0).toLocaleString("vi-VN")}đ</div>
              <div class="actions">
                ${isDone
                  ? `<button type="button" class="btn-undo" data-action="status" data-id="${escapeHtml(o.id)}" data-status="new">↩ Khôi phục lại đơn mới</button>`
                  : `
                    ${isUnackedNew
                      ? `<button type="button" class="btn-ack" data-action="ack" data-id="${escapeHtml(o.id)}">🔔 Xác nhận đơn mới</button>`
                      : ""
                    }
                    <button type="button" class="btn-done" data-action="status" data-id="${escapeHtml(o.id)}" data-status="done">✔ Hoàn tất</button>
                  `
                }
              </div>
            </div>
          </div>
        `;
      }

      function renderAll(data) {
        const todayKey = getDateKeyByOffset(0);
        document.getElementById("today-label").textContent =
          `Hôm nay: ${formatDateVN(todayKey)} — Tự động chuyển sang thư mục ngày sau 00:00`;

        const list = Object.entries(data || {}).map(([id, val]) => ({ id, ...(val || {}) }));
        list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

        renderRevenue(list);

        const todayOrders = list.filter(o => getDateKey(o.createdAt || o.completedAt || Date.now()) === todayKey);
        const newOrders = todayOrders.filter(o => o.status !== "done");
        const doneOrders = todayOrders.filter(o => o.status === "done");

        document.getElementById("new-count").textContent = newOrders.length;
        document.getElementById("done-count").textContent = doneOrders.length;

        document.getElementById("new-orders-grid").innerHTML = newOrders.length
          ? newOrders.map(renderOrderCard).join("")
          : `<div class="empty-msg">Hiện không có đơn mới nào hôm nay.</div>`;

        document.getElementById("done-orders-grid").innerHTML = doneOrders.length
          ? doneOrders.map(renderOrderCard).join("")
          : `<div class="empty-msg">Chưa có đơn nào hoàn tất hôm nay.</div>`;

        const archiveOrders = list.filter(o => getDateKey(o.createdAt || o.completedAt || Date.now()) !== todayKey);
        const groupedByDay = new Map();

        for (const order of archiveOrders) {
          const dKey = getDateKey(order.createdAt || order.completedAt || Date.now());
          if (!groupedByDay.has(dKey)) groupedByDay.set(dKey, []);
          groupedByDay.get(dKey).push(order);
        }

        for (const customKey of customFolders) {
          if (customKey !== todayKey && !groupedByDay.has(customKey)) {
            groupedByDay.set(customKey, []);
          }
        }

        const sortedDays = Array.from(groupedByDay.keys()).sort((a, b) => b.localeCompare(a));
        document.getElementById("archive-days-count").textContent = `${sortedDays.length} ngày`;

        const archiveContainer = document.getElementById("archive-days-container");
        archiveContainer.innerHTML = sortedDays.map(dateKey => {
          const dayList = groupedByDay.get(dateKey) || [];
          const dayTotal = dayList.reduce((sum, item) => sum + (Number(item.total) || 0), 0);
          const isOpen = expandedDays.has(dateKey);

          return `
            <div class="day-folder" data-date="${escapeHtml(dateKey)}">
              <div class="day-header" data-action="toggle-day" data-date="${escapeHtml(dateKey)}">
                <div class="day-title">
                  <span class="day-title-text">📅 Ngày ${formatDateVN(dateKey)}</span>
                  <span class="day-meta">(${dayList.length} đơn • Tổng: ${dayTotal.toLocaleString("vi-VN")}đ)</span>
                </div>
                <div class="day-controls">
                  <button type="button" class="btn-toggle" data-action="toggle-day" data-date="${escapeHtml(dateKey)}">
                    ${isOpen ? "▲ Thu gọn" : "▼ Xem đơn"}
                  </button>
                  <button type="button" class="btn-delete-day" data-action="delete-day" data-date="${escapeHtml(dateKey)}">
                    🗑 Xóa ngày này
                  </button>
                </div>
              </div>
              <div class="grid day-orders ${isOpen ? "is-open" : ""}">
                ${dayList.length
                  ? dayList.map(renderOrderCard).join("")
                  : `<div class="empty-msg">Chưa có đơn nào trong thư mục ngày ${formatDateVN(dateKey)}.</div>`
                }
              </div>
            </div>
          `;
        }).join("");

        syncAlertLoop();
      }

      customFolders.add(getDateKeyByOffset(-1));
      customFolders.add(getDateKeyByOffset(-2));
      renderAll(latestOrdersData);

      document.getElementById("month-selector").addEventListener("change", (e) => {
        selectedMonthKey = e.target.value;
        renderAll(latestOrdersData);
      });

      document.getElementById("btn-revenue").addEventListener("click", () => {
        const revBox = document.getElementById("revenue-section");
        if (revenueUnlocked) {
          revBox.classList.toggle("unlocked");
          return;
        }
        const pin = prompt("Nhập mật khẩu để xem mục Doanh thu:");
        if (pin === null) return;
        if (pin.trim() === REVENUE_PIN) {
          revenueUnlocked = true;
          revBox.classList.add("unlocked");
          renderAll(latestOrdersData);
        } else {
          alert("Mật khẩu không đúng!");
        }
      });

      document.getElementById("btn-lock-revenue").addEventListener("click", () => {
        revenueUnlocked = false;
        document.getElementById("revenue-section").classList.remove("unlocked");
      });

      document.getElementById("btn-sound").addEventListener("click", () => {
        soundEnabled = true;
        speakNewOrderAlert();
        syncAlertLoop();
        alert("Đã bật chuông báo! Khi có đơn mới sẽ kêu 'Có đơn mới, có đơn mới' cho đến khi bấm Xác nhận đơn mới.");
      });

      document.getElementById("btn-mute-alert").addEventListener("click", () => {
        stopAlertLoop();
        document.getElementById("btn-mute-alert").classList.remove("ringing");
      });

      document.getElementById("btn-add-folder").addEventListener("click", () => {
        const input = prompt("Nhập ngày muốn tạo thư mục (DD/MM/YYYY, ví dụ: 21/11/2026):");
        if (!input) return;
        const match = input.trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
        if (!match) {
          alert("Vui lòng nhập đúng định dạng DD/MM/YYYY (ví dụ: 21/11/2026).");
          return;
        }
        const day = String(match[1]).padStart(2, "0");
        const month = String(match[2]).padStart(2, "0");
        const year = match[3];
        const dateKey = `${year}-${month}-${day}`;
        customFolders.add(dateKey);
        expandedDays.add(dateKey);
        renderAll(latestOrdersData);
      });

      document.addEventListener("click", async (e) => {
        const target = e.target.closest("[data-action]");
        if (!target) return;

        const action = target.getAttribute("data-action");

        if (action === "ack") {
          const orderId = target.getAttribute("data-id");
          if (!orderId) return;
          acknowledgedOrderIds.add(orderId);
          saveAckIds();
          renderAll(latestOrdersData);
          return;
        }

        if (action === "toggle-day") {
          const dateKey = target.getAttribute("data-date");
          if (!dateKey) return;
          if (expandedDays.has(dateKey)) {
            expandedDays.delete(dateKey);
          } else {
            expandedDays.add(dateKey);
          }
          renderAll(latestOrdersData);
          return;
        }

        if (action === "delete-day") {
          e.stopPropagation();
          const dateKey = target.getAttribute("data-date");
          if (!dateKey) return;

          const label = formatDateVN(dateKey);
          const targetIds = Object.entries(latestOrdersData)
            .filter(([, val]) => getDateKey((val && (val.createdAt || val.completedAt)) || Date.now()) === dateKey)
            .map(([id]) => id);

          if (!targetIds.length) {
            customFolders.delete(dateKey);
            expandedDays.delete(dateKey);
            renderAll(latestOrdersData);
            return;
          }

          const ok = confirm(`Xóa toàn bộ ${targetIds.length} đơn của ngày ${label}?`);
          if (!ok) return;

          if (typeof window.__firebaseDeleteOrders === "function") {
            await window.__firebaseDeleteOrders(targetIds);
          }
          for (const id of targetIds) acknowledgedOrderIds.delete(id);
          saveAckIds();
          customFolders.delete(dateKey);
          expandedDays.delete(dateKey);
          renderAll(latestOrdersData);
          return;
        }

        if (action === "status") {
          const orderId = target.getAttribute("data-id");
          const status = target.getAttribute("data-status");
          if (!orderId || !status) return;
          if (status === "done") {
            acknowledgedOrderIds.add(orderId);
            saveAckIds();
          } else if (status === "new") {
            acknowledgedOrderIds.delete(orderId);
            saveAckIds();
          }
          const payload = { status };
          if (status === "done") payload.completedAt = Date.now();
          if (typeof window.__firebaseUpdateOrder === "function") {
            window.__firebaseUpdateOrder(orderId, payload);
          }
        }
      });

      window.__kitchenBridge = {
        setOrdersData(data, hasBrandNewOrder) {
          latestOrdersData = data || {};
          renderAll(latestOrdersData);
          if (hasBrandNewOrder && soundEnabled) {
            speakNewOrderAlert();
          }
        },
        reportError(msg) {
          showError(msg);
        }
      };

      setInterval(() => {
        renderAll(latestOrdersData);
      }, 30000);
    })();
  </script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBghiBbYsyo7F5AjWgcQqcCXyoVHi5nVz8",
      authDomain: "mohinhquan.firebaseapp.com",
      databaseURL: "https://mohinhquan-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "mohinhquan",
      storageBucket: "mohinhquan.firebasestorage.app",
      messagingSenderId: "557675172063",
      appId: "1:557675172063:web:baf9433c28328878dbd96a"
    };

    try {
      const app = initializeApp(firebaseConfig);
      const db = getDatabase(app);

      let isFirstLoad = true;
      const knownIds = new Set();

      window.__firebaseUpdateOrder = function (orderId, payload) {
        return update(ref(db, `orders/${orderId}`), payload);
      };

      window.__firebaseDeleteOrders = function (ids) {
        return Promise.all(ids.map(id => remove(ref(db, `orders/${id}`))));
      };

      onValue(ref(db, "orders"), (snapshot) => {
        const data = snapshot.val() || {};
        const list = Object.entries(data).map(([id, val]) => ({ id, ...(val || {}) }));

        let hasBrandNewOrder = false;
        for (const o of list) {
          if (!knownIds.has(o.id)) {
            knownIds.add(o.id);
            if (!isFirstLoad && (!o.status || o.status === "new")) {
              hasBrandNewOrder = true;
            }
          }
        }
        isFirstLoad = false;

        if (window.__kitchenBridge) {
          window.__kitchenBridge.setOrdersData(data, hasBrandNewOrder);
        }
      }, (err) => {
        if (window.__kitchenBridge) {
          window.__kitchenBridge.reportError("Lỗi đọc dữ liệu Firebase: " + err.message);
        }
      });
    } catch (err) {
      if (window.__kitchenBridge) {
        window.__kitchenBridge.reportError("Lỗi khởi tạo Firebase: " + (err && err.message ? err.message : String(err)));
      }
    }
  </script>
