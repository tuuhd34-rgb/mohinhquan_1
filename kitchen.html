<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quầy Tiếp Nhận Đơn</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #0f172a;
      color: #f8fafc;
      font-family: Arial, sans-serif;
    }

    /* Màn hình đăng nhập luôn nổi rõ khi chưa đăng nhập */
    #login-screen {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    #login-screen.hidden { display: none; }
    .login-card {
      width: 100%;
      max-width: 380px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 22px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
    }
    .login-title { margin: 0 0 6px 0; font-size: 20px; color: #f8fafc; }
    .login-sub { margin: 0 0 18px 0; font-size: 13px; color: #94a3b8; }
    .login-field { margin-bottom: 14px; }
    .login-label { display: block; font-size: 13px; font-weight: bold; color: #cbd5e1; margin-bottom: 6px; }
    .login-input {
      width: 100%;
      padding: 11px 12px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #f8fafc;
      font-size: 16px;
    }
    .login-input:focus { outline: none; border-color: #38bdf8; }
    .login-btn {
      width: 100%;
      padding: 12px 14px;
      border: none;
      border-radius: 8px;
      background: #22c55e;
      color: #052e16;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }
    .login-btn:hover { background: #16a34a; }
    .login-error {
      display: none;
      margin-top: 10px;
      padding: 8px 10px;
      border-radius: 8px;
      background: #7f1d1d;
      border: 1px solid #ef4444;
      color: #fecaca;
      font-size: 13px;
    }

    #app-shell {
      display: none;
      padding: 16px;
    }
    #app-shell.unlocked { display: block; }

    .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
    .top-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .sound-btn { padding: 10px 14px; border: none; border-radius: 8px; background: #38bdf8; color: #082f49; font-weight: bold; cursor: pointer; }
    .sound-btn:hover { background: #0ea5e9; }
    .mute-btn { padding: 10px 14px; border: none; border-radius: 8px; background: #f97316; color: #fff; font-weight: bold; cursor: pointer; display: none; }
    .mute-btn.ringing { display: inline-block; animation: pulseBtn 1s infinite; }
    @keyframes pulseBtn { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }

    .revenue-btn { padding: 10px 14px; border: none; border-radius: 8px; background: #facc15; color: #422006; font-weight: bold; cursor: pointer; }
    .revenue-btn:hover { background: #eab308; }
    .lock-btn { padding: 7px 12px; border: 1px solid #475569; border-radius: 6px; background: #1e293b; color: #e2e8f0; font-weight: bold; cursor: pointer; font-size: 13px; }
    .lock-btn:hover { background: #334155; }

    #error-box { display: none; background: #7f1d1d; border: 1px solid #ef4444; color: #fecaca; padding: 10px 12px; border-radius: 8px; margin-bottom: 14px; font-size: 13px; white-space: pre-wrap; }

    #support-alerts-box { display: none; background: #450a0a; border: 2px solid #ef4444; border-radius: 12px; padding: 14px; margin-bottom: 18px; box-shadow: 0 0 20px rgba(239, 68, 68, 0.35); }
    #support-alerts-box.has-calls { display: block; }
    .support-title { font-size: 16px; font-weight: bold; color: #fca5a5; margin-bottom: 10px; }
    .support-list { display: flex; flex-wrap: wrap; gap: 10px; }
    .support-item { background: #7f1d1d; border: 1px solid #f87171; border-radius: 10px; padding: 10px 14px; display: flex; align-items: center; gap: 12px; }
    .support-text { font-size: 16px; font-weight: bold; color: #fff; }
    .support-time { font-size: 12px; color: #fecaca; margin-top: 2px; }
    .btn-resolve-call { padding: 8px 12px; border: none; border-radius: 7px; background: #22c55e; color: #052e16; font-weight: bold; cursor: pointer; font-size: 13px; }
    .btn-resolve-call:hover { background: #16a34a; }

    #revenue-section { display: none; background: #131c31; border: 1px solid #ca8a04; border-radius: 12px; padding: 16px; margin-bottom: 20px; }
    #revenue-section.unlocked { display: block; }
    .revenue-header { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
    .revenue-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
    .revenue-card { background: #1e293b; border-radius: 10px; padding: 14px; border-left: 4px solid #facc15; }
    .revenue-card.month { border-left-color: #38bdf8; }
    .revenue-label { font-size: 13px; color: #94a3b8; margin-bottom: 6px; }
    .revenue-amount { font-size: 22px; font-weight: bold; color: #f8fafc; }
    .revenue-sub { font-size: 12px; color: #cbd5e1; margin-top: 4px; }
    .month-select { background: #0f172a; color: #f8fafc; border: 1px solid #475569; border-radius: 6px; padding: 5px 8px; font-size: 13px; margin-top: 8px; }

    .section-title { font-size: 16px; font-weight: bold; margin: 20px 0 12px 0; padding-bottom: 8px; border-bottom: 1px solid #334155; display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
    .section-left { display: flex; align-items: center; gap: 8px; }
    .count-pill { background: #334155; color: #f8fafc; padding: 2px 8px; border-radius: 99px; font-size: 13px; }
    .count-pill.active { background: #22c55e; color: #052e16; }

    .btn-add-folder { padding: 6px 12px; border: none; border-radius: 6px; background: #3b82f6; color: #fff; font-size: 13px; font-weight: bold; cursor: pointer; }
    .btn-add-folder:hover { background: #2563eb; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; }
    .order-card { background: #1e293b; border-left: 5px solid #22c55e; border-radius: 10px; padding: 14px; display: flex; flex-direction: column; justify-content: space-between; }
    .order-card.unacked { border: 2px solid #facc15; border-left: 6px solid #facc15; box-shadow: 0 0 16px rgba(250, 204, 21, 0.25); }
    .order-card.done { border-left-color: #64748b; opacity: 0.78; background: #162032; }

    .badge { display: inline-block; padding: 3px 8px; border-radius: 6px; font-size: 12px; font-weight: bold; background: #22c55e; color: #052e16; }
    .badge.unacked-badge { background: #facc15; color: #422006; margin-left: 4px; }
    .done .badge { background: #64748b; color: #fff; }

    .mode-tag { display: inline-block; margin-left: 6px; padding: 2px 7px; border-radius: 5px; font-size: 11px; font-weight: bold; background: #334155; color: #e2e8f0; vertical-align: middle; }
    .item-note { color: #7dd3fc; font-size: 12px; margin-top: 2px; }
    .order-note { color: #fde047; font-size: 13px; margin-bottom: 8px; padding: 6px 8px; background: rgba(253, 224, 71, 0.08); border-radius: 6px; }

    .actions { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px; }
    .actions button { flex: 1; min-width: 120px; padding: 9px 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; }
    .btn-ack { background: #facc15; color: #422006; }
    .btn-ack:hover { background: #eab308; }
    .btn-done { background: #22c55e; color: #052e16; }
    .btn-done:hover { background: #16a34a; }
    .btn-undo { background: #334155; color: #cbd5e1; }
    .btn-undo:hover { background: #475569; }
    .empty-msg { color: #64748b; font-style: italic; font-size: 14px; padding: 10px 0; grid-column: 1 / -1; }

    .day-folder { background: #131c31; border: 1px solid #293548; border-radius: 12px; padding: 14px; margin-bottom: 14px; }
    .day-header { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; cursor: pointer; user-select: none; }
    .day-header:hover .day-title-text { color: #38bdf8; }
    .day-title { font-size: 15px; font-weight: bold; color: #e2e8f0; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .day-meta { font-size: 13px; color: #94a3b8; font-weight: normal; }
    .day-controls { display: flex; gap: 8px; align-items: center; }
    .btn-toggle { padding: 6px 11px; border: 1px solid #334155; border-radius: 6px; background: #1e293b; color: #e2e8f0; cursor: pointer; font-size: 13px; font-weight: bold; }
    .btn-toggle:hover { background: #334155; }
    .btn-delete-day { padding: 6px 11px; border: none; border-radius: 6px; background: #dc2626; color: #fff; cursor: pointer; font-size: 13px; font-weight: bold; }
    .btn-delete-day:hover { background: #b91c1c; }
