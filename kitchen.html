<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quầy Tiếp Nhận Đơn</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; margin: 0; padding: 16px; background: #0f172a; color: #f8fafc; }

    /* Màn hình đăng nhập & đổi mật khẩu quầy tiếp nhận */
    #login-gate {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: radial-gradient(circle at top, #1e293b, #020617);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    #login-gate.hidden { display: none; }
    .login-card {
      width: 100%;
      max-width: 390px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 22px 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }
    .login-title { margin: 0 0 6px; font-size: 20px; font-weight: bold; color: #f8fafc; text-align: center; }
    .login-sub { margin: 0 0 16px; font-size: 13px; color: #94a3b8; text-align: center; }

    .auth-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      background: #1e293b;
      padding: 4px;
      border-radius: 9px;
      margin-bottom: 14px;
    }
    .auth-tab {
      border: none;
      background: transparent;
      color: #94a3b8;
      padding: 8px;
      border-radius: 7px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }
    .auth-tab.active {
      background: #38bdf8;
      color: #082f49;
    }

    .login-field { margin-bottom: 12px; }
    .login-field label { display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 5px; font-weight: bold; }
    .login-field input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #1e293b;
      color: #f8fafc;
      font-size: 15px;
      outline: none;
    }
    .login-field input:focus { border-color: #38bdf8; }
    .login-btn {
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 8px;
      background: #22c55e;
      color: #052e16;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }
    .login-btn:hover { background: #16a34a; }
    .login-btn.change-btn {
      background: #38bdf8;
      color: #082f49;
    }
    .login-btn.change-btn:hover { background: #0ea5e9; }

    .login-msg {
      display: none;
      margin-top: 12px;
      padding: 9px 10px;
      border-radius: 8px;
      font-size: 13px;
      text-align: center;
      font-weight: bold;
    }
    .login-msg.error {
      display: block;
      background: rgba(239, 68, 68, 0.16);
      border: 1px solid #ef4444;
      color: #fca5a5;
    }
    .login-msg.success {
      display: block;
      background: rgba(34, 197, 94, 0.16);
      border: 1px solid #22c55e;
      color: #86efac;
    }

    #app-content.locked { display: none; }

    .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
    .top-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .sound-btn { padding: 10px 14px; border: none; border-radius: 8px; background: #38bdf8; color: #082f49; font-weight: bold; cursor: pointer; }
    .sound-btn:hover { background: #0ea5e9; }
    .sound-btn.active { background: #22c55e; color: #052e16; }

    .revenue-btn { padding: 10px 14px; border: none; border-radius: 8px; background: #facc15; color: #422006; font-weight: bold; cursor: pointer; }
    .revenue-btn:hover { background: #eab308; }
    .pw-btn { padding: 10px 14px; border: 1px solid #475569; border-radius: 8px; background: #1e293b; color: #e2e8f0; font-weight: bold; cursor: pointer; }
    .pw-btn:hover { background: #334155; }
    .logout-btn { padding: 10px 14px; border: 1px solid #ef4444; border-radius: 8px; background: rgba(239, 68, 68, 0.14); color: #fca5a5; font-weight: bold; cursor: pointer; }
    .logout-btn:hover { background: #dc2626; color: #fff; }
    .lock-btn { padding: 7px 12px; border: 1px solid #475569; border-radius: 6px; background: #1e293b; color: #e2e8f0; font-weight: bold; cursor: pointer; font-size: 13px; }
    .lock-btn:hover { background: #334155; }

    #error-box { display: none; background: #7f1d1d; border: 1px solid #ef4444; color: #fecaca; padding: 10px 12px; border-radius: 8px; margin-bottom: 14px; font-size: 13px; white-space: pre-wrap; }

    #support-alerts-box { display: none; background: #450a0a; border: 2px solid #ef4444; border-radius: 12px; padding: 14px; margin-bottom: 18px; box-shadow: 0 0 20px rgba(239, 68, 68, 0.35); }
    #support-alerts-box.has-calls { display: block; }
    .support-title { font-size: 16px; font-weight: bold; color: #fca5a5; margin-bottom: 10px; }
    .support-list { display: flex; flex-wrap: wrap; gap: 10px; }
    .support-item { background: #7f1d1d; border: 1px solid #f87171; border-radius: 10px; padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px; min-width: 260px; }
    .support-text { font-size: 15px; font-weight: bold; color: #fff; }
    .support-note { font-size: 13px; color: #fde047; margin-top: 4px; font-weight: bold; }
    .support-time { font-size: 12px; color: #fecaca; margin-top: 3px; }
    .btn-resolve-call { padding: 8px 12px; border: none; border-radius: 7px; background: #22c55e; color: #052e16; font-weight: bold; cursor: pointer; font-size: 13px; white-space: nowrap; }
    .btn-resolve-call:hover { background: #16a34a; }

    #revenue-section { display: none; background: #131c31; border: 1px solid #ca8a04; border-radius: 12px; padding: 16px; margin-bottom: 20px; }
    #revenue-section.unlocked { display: block; }
    .revenue-header { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
    .revenue-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
    .revenue-card { background: #1e293b; border-radius: 10px; padding: 14px; border-left: 4px solid #facc15; }
    .revenue-card.month { border-left-color: #38bdf8; }
    .revenue-label { font-size: 13px; color: #94a3b8; margin-bottom: 6px; }
    .revenue-amount { font-size: 22px; font-weight: bold; color: #f8fafc; }
    .revenue-sub { font-size: 12px; color: #cbd5e1; margin-top: 4px; }
    .month-select { background: #0f172a; color: #f8fafc; border: 1px solid #475569; border-radius: 6px; padding: 5px 8px; font-size: 13px; margin-top: 8px; }

    .section-title { font-size: 16px; font-weight: bold; margin: 20px 0 12px 0; padding-bottom: 8px; border-bottom: 1px solid #334155; display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
    .section-left { display: flex; align-items: center; gap: 8px; }
    .count-pill { background: #334155; color: #f8fafc; padding: 2px 8px; border-radius: 99px; font-size: 13px; }
    .count-pill.active { background: #22c55e; color: #052e16; }

    .btn-add-folder { padding: 6px 12px; border: none; border-radius: 6px; background: #3b82f6; color: #fff; font-size: 13px; font-weight: bold; cursor: pointer; }
    .btn-add-folder:hover { background: #2563eb; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; }
    .order-card { background: #1e293b; border-left: 5px solid #22c55e; border-radius: 10px; padding: 14px; display: flex; flex-direction: column; justify-content: space-between; }
    .order-card.unacked { border: 2px solid #facc15; border-left: 6px solid #facc15; box-shadow: 0 0 16px rgba(250, 204, 21, 0.25); }
    .order-card.done { border-left-color: #64748b; opacity: 0.78; background: #162032; }

    .badge { display: inline-block; padding: 3px 8px; border-radius: 6px; font-size: 12px; font-weight: bold; background: #22c55e; color: #052e16; }
    .badge.unacked-badge { background: #facc15; color: #422006; margin-left: 4px; }
    .done .badge { background: #64748b; color: #fff; }

    .mode-tag { display: inline-block; margin-left: 6px; padding: 2px 7px; border-radius: 5px; font-size: 11px; font-weight: bold; background: #334155; color: #e2e8f0; vertical-align: middle; }
    .item-note { color: #7dd3fc; font-size: 12px; margin-top: 2px; }
    .order-note { color: #fde047; font-size: 13px; margin-bottom: 8px; padding: 6px 8px; background: rgba(253, 224, 71, 0.08); border-radius: 6px; }

    .actions { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px; }
    .actions button { flex: 1; min-width: 120px; padding: 9px 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; }
    .btn-ack { background: #facc15; color: #422006; }
    .btn-ack:hover { background: #eab308; }
    .btn-done { background: #22c55e; color: #052e16; }
    .btn-done:hover { background: #16a34a; }
    .btn-undo { background: #334155; color: #cbd5e1; }
    .btn-undo:hover { background: #475569; }
    .empty-msg { color: #64748b; font-style: italic; font-size: 14px; padding: 10px 0; grid-column: 1 / -1; }

    .day-folder { background: #131c31; border: 1px solid #293548; border-radius: 12px; padding: 14px; margin-bottom: 14px; }
    .day-header { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; cursor: pointer; user-select: none; }
    .day-header:hover .day-title-text { color: #38bdf8; }
    .day-title { font-size: 15px; font-weight: bold; color: #e2e8f0; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .day-meta { font-size: 13px; color: #94a3b8; font-weight: normal; }
    .day-controls { display: flex; gap: 8px; align-items: center; }
    .btn-toggle { padding: 6px 11px; border: 1px solid #334155; border-radius: 6px; background: #1e293b; color: #e2e8f0; cursor: pointer; font-size: 13px; font-weight: bold; }
    .btn-toggle:hover { background: #334155; }
    .btn-delete-day { padding: 6px 11px; border: none; border-radius: 6px; background: #dc2626; color: #fff; cursor: pointer; font-size: 13px; font-weight: bold; }
    .btn-delete-day:hover { background: #b91c1c; }

    .day-orders { margin-top: 12px; display: none; }
    .day-orders.is-open { display: grid; }
  </style>
</head>
<body>
  <div id="login-gate">
    <div class="login-card">
      <h2 class="login-title">🔐 QUẦY TIẾP NHẬN ĐƠN</h2>
      <p class="login-sub">Đăng nhập để mở quầy hoặc đổi mật khẩu đăng nhập</p>

      <div class="auth-tabs">
        <button id="tab-login" type="button" class="auth-tab active">Đăng nhập</button>
        <button id="tab-change-pw" type="button" class="auth-tab">Đổi mật khẩu</button>
      </div>

      <div id="panel-login">
        <div class="login-field">
          <label for="login-user">Tài khoản</label>
          <input id="login-user" type="text" placeholder="Nhập tài khoản" autocomplete="off" />
        </div>
        <div class="login-field">
          <label for="login-pass">Mật khẩu</label>
          <input id="login-pass" type="password" placeholder="Nhập mật khẩu" autocomplete="off" />
        </div>
        <button id="login-submit-btn" type="button" class="login-btn">Đăng nhập</button>
      </div>

      <div id="panel-change-pw" style="display:none;">
        <div class="login-field">
          <label for="cpw-user">Tài khoản</label>
          <input id="cpw-user" type="text" placeholder="Nhập tài khoản hiện tại" autocomplete="off" />
        </div>
        <div class="login-field">
          <label for="cpw-old">Mật khẩu hiện tại</label>
          <input id="cpw-old" type="password" placeholder="Nhập mật khẩu hiện tại" autocomplete="off" />
        </div>
        <div class="login-field">
          <label for="cpw-new">Mật khẩu mới</label>
          <input id="cpw-new" type="password" placeholder="Nhập mật khẩu mới" autocomplete="off" />
        </div>
        <div class="login-field">
          <label for="cpw-confirm">Nhập lại mật khẩu mới</label>
          <input id="cpw-confirm" type="password" placeholder="Xác nhận mật khẩu mới" autocomplete="off" />
        </div>
        <button id="cpw-submit-btn" type="button" class="login-btn change-btn">Lưu mật khẩu mới</button>
      </div>

      <div id="login-msg" class="login-msg"></div>
    </div>
  </div>

  <div id="app-content" class="locked">
    <div id="error-box"></div>

    <div id="support-alerts-box">
      <div class="support-title">🚨 YÊU CẦU HỖ TRỢ TỪ BÀN</div>
      <div id="support-alerts-list" class="support-list"></div>
    </div>

    <div class="top">
      <div>
        <h2 style="margin:0;">QUẦY TIẾP NHẬN ĐƠN</h2>
        <div id="today-label" style="font-size:13px; color:#94a3b8; margin-top:4px;"></div>
      </div>
      <div class="top-actions">
        <button type="button" id="btn-revenue" class="revenue-btn">💰 Doanh thu</button>
        <button type="button" id="btn-sound" class="sound-btn">🔔 Bật chuông báo đơn</button>
        <button type="button" id="btn-open-pw" class="pw-btn">🔑 Đổi mật khẩu</button>
        <button type="button" id="btn-logout" class="logout-btn">🚪 Đăng xuất</button>
      </div>
    </div>

    <div id="revenue-section">
      <div class="revenue-header">
        <div style="font-size:16px; font-weight:bold; color:#fde047;">💰 BÁO CÁO DOANH THU</div>
        <button type="button" id="btn-lock-revenue" class="lock-btn">🔒 Khóa lại</button>
      </div>
      <div class="revenue-grid">
        <div class="revenue-card">
          <div id="rev-today-label" class="revenue-label">Doanh thu hôm nay</div>
          <div id="rev-today-amount" class="revenue-amount">0đ</div>
          <div id="rev-today-count" class="revenue-sub">0 đơn</div>
        </div>
        <div class="revenue-card month">
          <div id="rev-month-label" class="revenue-label">Doanh thu tháng</div>
          <div id="rev-month-amount" class="revenue-amount">0đ</div>
          <div id="rev-month-count" class="revenue-sub">0 đơn</div>
          <select id="month-selector" class="month-select" aria-label="Chọn tháng xem doanh thu"></select>
        </div>
      </div>
    </div>

    <div class="section-title">
      <div class="section-left">
        <span>🟢 ĐƠN MỚI (HÔM NAY)</span>
        <span id="new-count" class="count-pill active">0</span>
      </div>
    </div>
    <div id="new-orders-grid" class="grid"></div>

    <div class="section-title" style="margin-top: 28px;">
      <div class="section-left">
        <span>⚪ ĐÃ XONG (HÔM NAY)</span>
        <span id="done-count" class="count-pill">0</span>
      </div>
    </div>
    <div id="done-orders-grid" class="grid"></div>

    <div class="section-title" style="margin-top: 34px;">
      <div class="section-left">
        <span>📁 THƯ MỤC ĐƠN THEO NGÀY</span>
        <span id="archive-days-count" class="count-pill">0 ngày</span>
      </div>
      <button type="button" id="btn-add-folder" class="btn-add-folder">➕ Tạo thư mục ngày</button>
    </div>
    <div id="archive-days-container"></div>
  </div>

  <script>
    (function () {
      const DEFAULT_USER = "abcd";
      const DEFAULT_PASS = "9999";
      const STORAGE_CREDS_KEY = "kitchen_login_creds_v1";
      const STORAGE_ACK_KEY = "kitchen_acked_orders_v1";
      const STORAGE_NOTIFIED_ORDERS_KEY = "kitchen_notified_orders_v1";
      const STORAGE_NOTIFIED_CALLS_KEY = "kitchen_notified_calls_v1";

      const REVENUE_PIN = "9999";
      const NEW_ORDER_PHRASE = "Có đơn mới, có đơn mới";

      function loadCreds() {
        try {
          const raw = localStorage.getItem(STORAGE_CREDS_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed && parsed.user && parsed.pass) {
              return { user: String(parsed.user), pass: String(parsed.pass) };
            }
          }
        } catch (_) {}
        return { user: DEFAULT_USER, pass: DEFAULT_PASS };
      }

      function saveCreds(creds) {
        try {
          localStorage.setItem(STORAGE_CREDS_KEY, JSON.stringify(creds));
        } catch (_) {}
      }

      function loadSet(key) {
        try {
          const arr = JSON.parse(localStorage.getItem(key) || "[]");
          return new Set(Array.isArray(arr) ? arr : []);
        } catch (_) {
          return new Set();
        }
      }

      function saveSet(key, setObj) {
        try {
          // Giữ tối đa 500 ID gần nhất để tránh phình bộ nhớ
          const arr = Array.from(setObj).slice(-500);
          localStorage.setItem(key, JSON.stringify(arr));
        } catch (_) {}
      }

      let creds = loadCreds();

      const loginGate = document.getElementById("login-gate");
      const appContent = document.getElementById("app-content");
      const tabLogin = document.getElementById("tab-login");
      const tabChangePw = document.getElementById("tab-change-pw");
      const panelLogin = document.getElementById("panel-login");
      const panelChangePw = document.getElementById("panel-change-pw");

      const loginUserInput = document.getElementById("login-user");
      const loginPassInput = document.getElementById("login-pass");
      const loginSubmitBtn = document.getElementById("login-submit-btn");

      const cpwUserInput = document.getElementById("cpw-user");
      const cpwOldInput = document.getElementById("cpw-old");
      const cpwNewInput = document.getElementById("cpw-new");
      const cpwConfirmInput = document.getElementById("cpw-confirm");
      const cpwSubmitBtn = document.getElementById("cpw-submit-btn");

      const loginMsg = document.getElementById("login-msg");
      const errorBox = document.getElementById("error-box");
      const soundBtn = document.getElementById("btn-sound");

      let unlocked = false;
      let soundEnabled = false;
      let revenueUnlocked = false;
      let selectedMonthKey = null;
      let latestOrdersMap = new Map();
      let latestCallsMap = new Map();
      const expandedDays = new Set();
      const customFolders = new Set();

      const acknowledgedOrderIds = loadSet(STORAGE_ACK_KEY);
      const notifiedOrderIds = loadSet(STORAGE_NOTIFIED_ORDERS_KEY);
      const notifiedCallIds = loadSet(STORAGE_NOTIFIED_CALLS_KEY);

      function showLoginMsg(text, type) {
        loginMsg.className = "login-msg " + type;
        loginMsg.textContent = text;
      }

      function clearLoginMsg() {
        loginMsg.className = "login-msg";
        loginMsg.textContent = "";
      }

      function setAuthTab(mode) {
        clearLoginMsg();
        const isChange = mode === "change";
        tabLogin.classList.toggle("active", !isChange);
        tabChangePw.classList
