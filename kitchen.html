<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quầy Tiếp Nhận Đơn</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; margin: 0; padding: 16px; background: #0f172a; color: #f8fafc; }

    /* Màn hình đăng nhập & đổi mật khẩu quầy tiếp nhận */
    #login-gate {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: radial-gradient(circle at top, #1e293b, #020617);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    #login-gate.hidden { display: none; }
    .login-card {
      width: 100%;
      max-width: 390px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 22px 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }
    .login-title { margin: 0 0 6px; font-size: 20px; font-weight: bold; color: #f8fafc; text-align: center; }
    .login-sub { margin: 0 0 16px; font-size: 13px; color: #94a3b8; text-align: center; }

    .auth-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      background: #1e293b;
      padding: 4px;
      border-radius: 9px;
      margin-bottom: 14px;
    }
    .auth-tab {
      border: none;
      background: transparent;
      color: #94a3b8;
      padding: 8px;
      border-radius: 7px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }
    .auth-tab.active {
      background: #38bdf8;
      color: #082f49;
    }

    .login-field { margin-bottom: 12px; }
    .login-field label { display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 5px; font-weight: bold; }
    .login-field input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #1e293b;
      color: #f8fafc;
      font-size: 15px;
      outline: none;
    }
    .login-field input:focus { border-color: #38bdf8; }
    .login-btn {
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 8px;
      background: #22c55e;
      color: #052e16;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }
    .login-btn:hover { background: #16a34a; }
    .login-btn.change-btn {
      background: #38bdf8;
      color: #082f49;
    }
    .login-btn.change-btn:hover { background: #0ea5e9; }

    .login-msg {
      display: none;
      margin-top: 12px;
      padding: 9px 10px;
      border-radius: 8px;
      font-size: 13px;
      text-align: center;
      font-weight: bold;
    }
    .login-msg.error {
      display: block;
      background: rgba(239, 68, 68, 0.16);
      border: 1px solid #ef4444;
      color: #fca5a5;
    }
    .login-msg.success {
      display: block;
      background: rgba(34, 197, 94, 0.16);
      border: 1px solid #22c55e;
      color: #86efac;
    }

    #app-content.locked { display: none; }

    .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
    .top-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .sound-btn { padding: 10px 14px; border: none; border-radius: 8px; background: #38bdf8; color: #082f49; font-weight: bold; cursor: pointer; }
    .sound-btn:hover { background: #0ea5e9; }
    .sound-btn.active { background: #22c55e; color: #052e16; }
    .mute-btn { padding: 10px 14px; border: none; border-radius: 8px; background: #f97316; color: #fff; font-weight: bold; cursor: pointer; display: none; }
    .mute-btn.ringing { display: inline-block; animation: pulseBtn 1s infinite; }
    @keyframes pulseBtn { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }

    .revenue-btn { padding: 10px 14px; border: none; border-radius: 8px; background: #facc15; color: #422006; font-weight: bold; cursor: pointer; }
    .revenue-btn:hover { background: #eab308; }
    .pw-btn { padding: 10px 14px; border: 1px solid #475569; border-radius: 8px; background: #1e293b; color: #e2e8f0; font-weight: bold; cursor: pointer; }
    .pw-btn:hover { background: #334155; }
    .logout-btn { padding: 10px 14px; border: 1px solid #ef4444; border-radius: 8px; background: rgba(239, 68, 68, 0.14); color: #fca5a5; font-weight: bold; cursor: pointer; }
    .logout-btn:hover { background: #dc2626; color: #fff; }
    .lock-btn { padding: 7px 12px; border: 1px solid #475569; border-radius: 6px; background: #1e293b; color: #e2e8f0; font-weight: bold; cursor: pointer; font-size: 13px; }
    .lock-btn:hover { background: #334155; }

    #error-box { display: none; background: #7f1d1d; border: 1px solid #ef4444; color: #fecaca; padding: 10px 12px; border-radius: 8px; margin-bottom: 14px; font-size: 13px; white-space: pre-wrap; }

    #support-alerts-box { display: none; background: #450a0a; border: 2px solid #ef4444; border-radius: 12px; padding: 14px; margin-bottom: 18px; box-shadow: 0 0 20px rgba(239, 68, 68, 0.35); }
    #support-alerts-box.has-calls { display: block; }
    .support-title { font-size: 16px; font-weight: bold; color: #fca5a5; margin-bottom: 10px; }
    .support-list { display: flex; flex-wrap: wrap; gap: 10px; }
    .support-item { background: #7f1d1d; border: 1px solid #f87171; border-radius: 10px; padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px; min-width: 270px; }
    .support-text { font-size: 15px; font-weight: bold; color: #fff; }
    .support-note { font-size: 13px; color: #fde047; margin-top: 4px; font-weight: bold; }
    .support-time { font-size: 12px; color: #fecaca; margin-top: 3px; }
    .btn-resolve-call { padding: 8px 12px; border: none; border-radius: 7px; background: #22c55e; color: #052e16; font-weight: bold; cursor: pointer; font-size: 13px; white-space: nowrap; }
    .btn-resolve-call:hover { background: #16a34a; }

    #revenue-section { display: none; background: #131c31; border: 1px solid #ca8a04; border-radius: 12px; padding: 16px; margin-bottom: 20px; }
    #revenue-section.unlocked { display: block; }
    .revenue-header { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
    .revenue-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
    .revenue-card { background: #1e293b; border-radius: 10px; padding: 14px; border-left: 4px solid #facc15; }
    .revenue-card.month { border-left-color: #38bdf8; }
    .revenue-label { font-size: 13px; color: #94a3b8; margin-bottom: 6px; }
    .revenue-amount { font-size: 22px; font-weight: bold; color: #f8fafc; }
    .revenue-sub { font-size: 12px; color: #cbd5e1; margin-top: 4px; }
    .month-select { background: #0f172a; color: #f8fafc; border: 1px solid #475569; border-radius: 6px; padding: 5px 8px; font-size: 13px; margin-top: 8px; }

    .section-title { font-size: 16px; font-weight: bold; margin: 20px 0 12px 0; padding-bottom: 8px; border-bottom: 1px solid #334155; display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
    .section-left { display: flex; align-items: center; gap: 8px; }
    .count-pill { background: #334155; color: #f8fafc; padding: 2px 8px; border-radius: 99px; font-size: 13px; }
    .count-pill.active { background: #22c55e; color: #052e16; }

    .btn-add-folder { padding: 6px 12px; border: none; border-radius: 6px; background: #3b82f6; color: #fff; font-size: 13px; font-weight: bold; cursor: pointer; }
    .btn-add-folder:hover { background: #2563eb; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; }
    .order-card { background: #1e293b; border-left: 5px solid #22c55e; border-radius: 10px; padding: 14px; display: flex; flex-direction: column; justify-content: space-between; }
    .order-card.unacked { border: 2px solid #facc15; border-left: 6px solid #facc15; box-shadow: 0 0 16px rgba(250, 204, 21, 0.25); }
    .order-card.done { border-left-color: #64748b; opacity: 0.78; background: #162032; }

    .badge { display: inline-block; padding: 3px 8px; border-radius: 6px; font-size: 12px; font-weight: bold; background: #22c55e; color: #052e16; }
    .badge.unacked-badge { background: #facc15; color: #422006; margin-left: 4px; }
    .done .badge { background: #64748b; color: #fff; }

    .mode-tag { display: inline-block; margin-left: 6px; padding: 2px 7px; border-radius: 5px; font-size: 11px; font-weight: bold; background: #334155; color: #e2e8f0; vertical-align: middle; }
    .item-note { color: #7dd3fc; font-size: 12px; margin-top: 2px; }
    .order-note { color: #fde047; font-size: 13px; margin-bottom: 8px; padding: 6px 8px; background: rgba(253, 224, 71, 0.08); border-radius: 6px; }

    .actions { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px; }
    .actions button { flex: 1; min-width: 120px; padding: 9px 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; }
    .btn-ack { background: #facc15; color: #422006; }
    .btn-ack:hover { background: #eab308; }
    .btn-done { background: #22c55e; color: #052e16; }
    .btn-done:hover { background: #16a34a; }
    .btn-undo { background: #334155; color: #cbd5e1; }
    .btn-undo:hover { background: #475569; }
    .empty-msg { color: #64748b; font-style: italic; font-size: 14px; padding: 10px 0; grid-column: 1 / -1; }

    .day-folder { background: #131c31; border: 1px solid #293548; border-radius: 12px; padding: 14px; margin-bottom: 14px; }
    .day-header { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; cursor: pointer; user-select: none; }
    .day-header:hover .day-title-text { color: #38bdf8; }
    .day-title { font-size: 15px; font-weight: bold; color: #e2e8f0; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .day-meta { font-size: 13px; color: #94a3b8; font-weight: normal; }
    .day-controls { display: flex; gap: 8px; align-items: center; }
    .btn-toggle { padding: 6px 11px; border: 1px solid #334155; border-radius: 6px; background: #1e293b; color: #e2e8f0; cursor: pointer; font-size: 13px; font-weight: bold; }
    .btn-toggle:hover { background: #334155; }
    .btn-delete-day { padding: 6px 11px; border: none; border-radius: 6px; background: #dc2626; color: #fff; cursor: pointer; font-size: 13px; font-weight: bold; }
    .btn-delete-day:hover { background: #b91c1c; }

    .day-orders { margin-top: 12px; display: none; }
    .day-orders.is-open { display: grid; }
  </style>
</head>
<body>
  <div id="login-gate">
    <div class="login-card">
      <h2 class="login-title">🔐 QUẦY TIẾP NHẬN ĐƠN</h2>
      <p class="login-sub">Đăng nhập để mở quầy hoặc đổi mật khẩu đăng nhập</p>

      <div class="auth-tabs">
        <button id="tab-login" type="button" class="auth-tab active">Đăng nhập</button>
        <button id="tab-change-pw" type="button" class="auth-tab">Đổi mật khẩu</button>
      </div>

      <div id="panel-login">
        <div class="login-field">
          <label for="login-user">Tài khoản</label>
          <input id="login-user" type="text" placeholder="Nhập tài khoản" autocomplete="off" />
        </div>
        <div class="login-field">
          <label for="login-pass">Mật khẩu</label>
          <input id="login-pass" type="password" placeholder="Nhập mật khẩu" autocomplete="off" />
        </div>
        <button id="login-submit-btn" type="button" class="login-btn">Đăng nhập</button>
      </div>

      <div id="panel-change-pw" style="display:none;">
        <div class="login-field">
          <label for="cpw-user">Tài khoản</label>
          <input id="cpw-user" type="text" placeholder="Nhập tài khoản hiện tại" autocomplete="off" />
        </div>
        <div class="login-field">
          <label for="cpw-old">Mật khẩu hiện tại</label>
          <input id="cpw-old" type="password" placeholder="Nhập mật khẩu hiện tại" autocomplete="off" />
        </div>
        <div class="login-field">
          <label for="cpw-new">Mật khẩu mới</label>
          <input id="cpw-new" type="password" placeholder="Nhập mật khẩu mới" autocomplete="off" />
        </div>
        <div class="login-field">
          <label for="cpw-confirm">Nhập lại mật khẩu mới</label>
          <input id="cpw-confirm" type="password" placeholder="Xác nhận mật khẩu mới" autocomplete="off" />
        </div>
        <button id="cpw-submit-btn" type="button" class="login-btn change-btn">Lưu mật khẩu mới</button>
      </div>

      <div id="login-msg" class="login-msg"></div>
    </div>
  </div>

  <div id="app-content" class="locked">
    <div id="error-box"></div>

    <div id="support-alerts-box">
      <div class="support-title">🚨 YÊU CẦU HỖ TRỢ TỪ BÀN</div>
      <div id="support-alerts-list" class="support-list"></div>
    </div>

    <div class="top">
      <div>
        <h2 style="margin:0;">QUẦY TIẾP NHẬN ĐƠN</h2>
        <div id="today-label" style="font-size:13px; color:#94a3b8; margin-top:4px;"></div>
      </div>
      <div class="top-actions">
        <button type="button" id="btn-mute-alert" class="mute-btn">🔇 Tạm tắt tiếng báo</button>
        <button type="button" id="btn-revenue" class="revenue-btn">💰 Doanh thu</button>
        <button type="button" id="btn-sound" class="sound-btn">🔔 Bật chuông báo đơn</button>
        <button type="button" id="btn-open-pw" class="pw-btn">🔑 Đổi mật khẩu</button>
        <button type="button" id="btn-logout" class="logout-btn">🚪 Đăng xuất</button>
      </div>
    </div>

    <div id="revenue-section">
      <div class="revenue-header">
        <div style="font-size:16px; font-weight:bold; color:#fde047;">💰 BÁO CÁO DOANH THU</div>
        <button type="button" id="btn-lock-revenue" class="lock-btn">🔒 Khóa lại</button>
      </div>
      <div class="revenue-grid">
        <div class="revenue-card">
          <div id="rev-today-label" class="revenue-label">Doanh thu hôm nay</div>
          <div id="rev-today-amount" class="revenue-amount">0đ</div>
          <div id="rev-today-count" class="revenue-sub">0 đơn</div>
        </div>
        <div class="revenue-card month">
          <div id="rev-month-label" class="revenue-label">Doanh thu tháng</div>
          <div id="rev-month-amount" class="revenue-amount">0đ</div>
          <div id="rev-month-count" class="revenue-sub">0 đơn</div>
          <select id="month-selector" class="month-select" aria-label="Chọn tháng xem doanh thu"></select>
        </div>
      </div>
    </div>

    <div class="section-title">
      <div class="section-left">
        <span>🟢 ĐƠN MỚI (HÔM NAY)</span>
        <span id="new-count" class="count-pill active">0</span>
      </div>
    </div>
    <div id="new-orders-grid" class="grid"></div>

    <div class="section-title" style="margin-top: 28px;">
      <div class="section-left">
        <span>⚪ ĐÃ XONG (HÔM NAY)</span>
        <span id="done-count" class="count-pill">0</span>
      </div>
    </div>
    <div id="done-orders-grid" class="grid"></div>

    <div class="section-title" style="margin-top: 34px;">
      <div class="section-left">
        <span>📁 THƯ MỤC ĐƠN THEO NGÀY</span>
        <span id="archive-days-count" class="count-pill">0 ngày</span>
      </div>
      <button type="button" id="btn-add-folder" class="btn-add-folder">➕ Tạo thư mục ngày</button>
    </div>
    <div id="archive-days-container"></div>
  </div>

  <script>
    (function () {
      const DEFAULT_USER = "abcd";
      const DEFAULT_PASS = "9999";
      const STORAGE_CREDS_KEY = "kitchen_login_creds_v1";
      const STORAGE_ACK_KEY = "kitchen_acked_orders_v1";
      const STORAGE_RESOLVED_CALLS_KEY = "kitchen_resolved_calls_v1";

      const REVENUE_PIN = "9999";
      const NEW_ORDER_PHRASE = "Có đơn mới, có đơn mới";

      function loadCreds() {
        try {
          const raw = localStorage.getItem(STORAGE_CREDS_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed && parsed.user && parsed.pass) {
              return { user: String(parsed.user), pass: String(parsed.pass) };
            }
          }
        } catch (_) {}
        return { user: DEFAULT_USER, pass: DEFAULT_PASS };
      }

      function saveCreds(creds) {
        try {
          localStorage.setItem(STORAGE_CREDS_KEY, JSON.stringify(creds));
        } catch (_) {}
      }

      function loadSet(key) {
        try {
          const arr = JSON.parse(localStorage.getItem(key) || "[]");
          return new Set(Array.isArray(arr) ? arr : []);
        } catch (_) {
          return new Set();
        }
      }

      function saveSet(key, setObj) {
        try {
          const arr = Array.from(setObj).slice(-500);
          localStorage.setItem(key, JSON.stringify(arr));
        } catch (_) {}
      }

      let creds = loadCreds();

      const loginGate = document.getElementById("login-gate");
      const appContent = document.getElementById("app-content");
      const tabLogin = document.getElementById("tab-login");
      const tabChangePw = document.getElementById("tab-change-pw");
      const panelLogin = document.getElementById("panel-login");
      const panelChangePw = document.getElementById("panel-change-pw");

      const loginUserInput = document.getElementById("login-user");
      const loginPassInput = document.getElementById("login-pass");
      const loginSubmitBtn = document.getElementById("login-submit-btn");

      const cpwUserInput = document.getElementById("cpw-user");
      const cpwOldInput = document.getElementById("cpw-old");
      const cpwNewInput = document.getElementById("cpw-new");
      const cpwConfirmInput = document.getElementById("cpw-confirm");
      const cpwSubmitBtn = document.getElementById("cpw-submit-btn");

      const loginMsg = document.getElementById("login-msg");
      const errorBox = document.getElementById("error-box");
      const soundBtn = document.getElementById("btn-sound");
      const muteBtn = document.getElementById("btn-mute-alert");

      let unlocked = false;
      let soundEnabled = false;
      let alertLoopTimer = null;
      let revenueUnlocked = false;
      let selectedMonthKey = null;
      let latestOrdersMap = new Map();
      let latestCallsMap = new Map();
      const expandedDays = new Set();
      const customFolders = new Set();

      const acknowledgedOrderIds = loadSet(STORAGE_ACK_KEY);
      const localResolvedCallIds = loadSet(STORAGE_RESOLVED_CALLS_KEY);

      function showLoginMsg(text, type) {
        loginMsg.className = "login-msg " + type;
        loginMsg.textContent = text;
      }

      function clearLoginMsg() {
        loginMsg.className = "login-msg";
        loginMsg.textContent = "";
      }

      function setAuthTab(mode) {
        clearLoginMsg();
        const isChange = mode === "change";
        tabLogin.classList.toggle("active", !isChange);
        tabChangePw.classList.toggle("active", isChange);
        panelLogin.style.display = isChange ? "none" : "block";
        panelChangePw.style.display = isChange ? "block" : "none";
        if (isChange) {
          cpwUserInput.value = creds.user;
        }
      }

      tabLogin.addEventListener("click", () => setAuthTab("login"));
      tabChangePw.addEventListener("click", () => setAuthTab("change"));

      function showError(msg) {
        if (!errorBox) return;
        errorBox.style.display = "block";
        errorBox.textContent = msg;
      }

      function stopAlertLoop() {
        if (alertLoopTimer) {
          clearInterval(alertLoopTimer);
          alertLoopTimer = null;
        }
        try {
          if ("speechSynthesis" in window) {
            window.speechSynthesis.cancel();
          }
        } catch (_) {}
        if (muteBtn) muteBtn.classList.remove("ringing");
      }

      function attemptLogin() {
        const u = (loginUserInput.value || "").trim().toLowerCase();
        const p = (loginPassInput.value || "").trim();
        if (u === creds.user.toLowerCase() && p === creds.pass) {
          unlocked = true;
          clearLoginMsg();
          loginGate.classList.add("hidden");
          appContent.classList.remove("locked");
          renderAll();
          renderStaffCalls();
          syncAlertLoop();
        } else {
          showLoginMsg("Tài khoản hoặc mật khẩu không đúng!", "error");
        }
      }

      function attemptChangePassword() {
        const u = (cpwUserInput.value || "").trim();
        const oldP = (cpwOldInput.value || "").trim();
        const newP = (cpwNewInput.value || "").trim();
        const confirmP = (cpwConfirmInput.value || "").trim();

        if (!u) {
          showLoginMsg("Vui lòng nhập tài khoản!", "error");
          return;
        }
        if (u.toLowerCase() !== creds.user.toLowerCase() || oldP !== creds.pass) {
          showLoginMsg("Tài khoản hoặc mật khẩu hiện tại không đúng!", "error");
          return;
        }
        if (!newP) {
          showLoginMsg("Vui lòng nhập mật khẩu mới!", "error");
          return;
        }
        if (newP !== confirmP) {
          showLoginMsg("Mật khẩu mới nhập lại không khớp!", "error");
          return;
        }

        creds = { user: u, pass: newP };
        saveCreds(creds);

        cpwOldInput.value = "";
        cpwNewInput.value = "";
        cpwConfirmInput.value = "";
        loginUserInput.value = u;
        loginPassInput.value = "";

        showLoginMsg("Đã đổi mật khẩu thành công! Hãy đăng nhập bằng mật khẩu mới.", "success");
        setTimeout(() => {
          setAuthTab("login");
        }, 900);
      }

      loginSubmitBtn.addEventListener("click", attemptLogin);

      function getDateKeyByOffset(offsetDays = 0) {
        const d = new Date();
        d.setDate(d.getDate() + offsetDays);
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, "0");
        const day = String(d.getDate()).padStart(2, "0");
        return `${y}-${m}-${day}`;
      }

      function getDateKey(ts) {
        const num = Number(ts);
        const d = Number.isFinite(num) && num > 0 ? new Date(num) : new Date();
        if (Number.isNaN(d.getTime())) return getDateKeyByOffset(0);
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, "0");
        const day = String(d.getDate()).padStart(2, "0");
        return `${y}-${m}-${day}`;
      }

      function getMonthKey(ts) {
        const num = Number(ts);
        const d = Number.isFinite(num) && num > 0 ? new Date(num) : new Date();
        if (Number.isNaN(d.getTime())) return getMonthKey(Date.now());
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, "0");
        return `${y}-${m}`;
      }

      function formatDateVN(dateKey) {
        const parts = String(dateKey || "").split("-");
        if (parts.length !== 3) return dateKey;
        const [y, m, d] = parts;
        return `${d}/${m}/${y}`;
      }

      function formatMonthVN(monthKey) {
        const parts = String(monthKey || "").split("-");
        if (parts.length !== 2) return monthKey;
        const [y, m] = parts;
        return `Tháng ${m}/${y}`;
      }

      function escapeHtml(str = "") {
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function playChime() {
        try {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          const ctx = new AudioCtx();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "triangle";
          osc.frequency.setValueAtTime(920, ctx.currentTime);
          gain.gain.setValueAtTime(0.18, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.22);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.22);
        } catch (_) {}
      }

      function speakPhrase(phrase) {
        if (!soundEnabled || !unlocked || !phrase) return;
        playChime();
        try {
          if ("speechSynthesis" in window) {
            window.speechSynthesis.cancel();
            const utter = new SpeechSynthesisUtterance(phrase);
            utter.lang = "vi-VN";
            utter.rate = 1.05;
            utter.pitch = 1.05;
            const voices = window.speechSynthesis.getVoices();
            const viVoice = voices.find(v => /vi/i.test(v.lang));
            if (viVoice) utter.voice = viVoice;
            window.speechSynthesis.speak(utter);
          }
        } catch (_) {}
      }

      function isOrderAcked(o) {
        return Boolean(o && (o.acked === true || acknowledgedOrderIds.has(o.id)));
      }

      function isCallResolved(c) {
        return Boolean(!c || c.status === "resolved" || c.status === "handled" || localResolvedCallIds.has(c.id));
      }

      function getUnackedNewOrders() {
        const todayKey = getDateKeyByOffset(0);
        return Array.from(latestOrdersMap.values())
          .filter(o => {
            if (!o || o.status === "done") return false;
            const orderDate = getDateKey(o.createdAt || o.completedAt || Date.now());
            return orderDate === todayKey && !isOrderAcked(o);
          });
      }

      function getPendingStaffCalls() {
        return Array.from(latestCallsMap.values())
          .filter(c => c && !isCallResolved(c))
          .sort((a, b) => (Number(b.createdAt) || 0) - (Number(a.createdAt) || 0));
      }

      function getNextAlertPhrase() {
        const pendingCalls = getPendingStaffCalls();
        if (pendingCalls.length > 0) {
          const top = pendingCalls[0];
          const tbl = top.table ? `Bàn ${top.table}` : "Có bàn";
          const noteText = String(top.note || "").trim();
          return noteText ? `${tbl} cần hỗ trợ: ${noteText}` : `${tbl} cần hỗ trợ`;
        }
        const unackedOrders = getUnackedNewOrders();
        if (unackedOrders.length > 0) {
          return NEW_ORDER_PHRASE;
        }
        return null;
      }

      function syncAlertLoop() {
        if (!unlocked || !soundEnabled) {
          stopAlertLoop();
          return;
        }

        const unackedOrders = getUnackedNewOrders();
        const pendingCalls = getPendingStaffCalls();
        const totalPending = unackedOrders.length + pendingCalls.length;

        if (totalPending <= 0) {
          stopAlertLoop();
          return;
        }

        muteBtn.classList.add("ringing");
        muteBtn.textContent = `🔇 Tạm tắt tiếng (${totalPending})`;

        if (!alertLoopTimer) {
          const firstPhrase = getNextAlertPhrase();
          if (firstPhrase) speakPhrase(firstPhrase);

          alertLoopTimer = setInterval(() => {
            if (!unlocked || !soundEnabled) {
              stopAlertLoop();
              return;
            }
            const nextPhrase = getNextAlertPhrase();
            if (!nextPhrase) {
              stopAlertLoop();
              return;
            }
            speakPhrase(nextPhrase);
          }, 4500);
        }
      }

      function renderStaffCalls() {
        const pendingCalls = getPendingStaffCalls();
        const box = document.getElementById("support-alerts-box");
        const listEl = document.getElementById("support-alerts-list");

        if (!pendingCalls.length) {
          box.classList.remove("has-calls");
          listEl.innerHTML = "";
          syncAlertLoop();
          return;
        }

        box.classList.add("has-calls");
        listEl.innerHTML = pendingCalls.map(c => {
          const tbl = escapeHtml(c.table || "");
          const noteText = String(c.note || "").trim();
          const rawMsg = String(c.message || "").trim();
          const titleLabel = tbl ? `Bàn ${tbl} đang gọi hỗ trợ` : "Có bàn đang gọi hỗ trợ";
          const detailText = noteText || rawMsg || (tbl ? `Bàn ${tbl} cần hỗ trợ` : "Cần hỗ trợ");
          const timeText = c.createdAt
            ? new Date(Number(c.createdAt)).toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit" })
            : "";

          return `
            <div class="support-item">
              <div>
                <div class="support-text">🔔 ${escapeHtml(titleLabel)}</div>
                <div class="support-note">Ghi chú từ khách: ${escapeHtml(detailText)}</div>
                ${timeText ? `<div class="support-time">Lúc ${timeText}</div>` : ""}
              </div>
              <button type="button" class="btn-resolve-call" data-action="resolve-call" data-id="${escapeHtml(c.id)}">
                ✔ Đã hỗ trợ
              </button>
            </div>
          `;
        }).join("");

        syncAlertLoop();
      }

      function renderRevenue(list) {
        const now = Date.now();
        const todayKey = getDateKey(now);
        const currentMonthKey = getMonthKey(now);

        const monthSet = new Set([currentMonthKey]);
        for (const o of list) {
          monthSet.add(getMonthKey((o.createdAt || o.completedAt) || now));
        }
        const sortedMonths = Array.from(monthSet).sort((a, b) => b.localeCompare(a));

        if (!selectedMonthKey || !monthSet.has(selectedMonthKey)) {
          selectedMonthKey = currentMonthKey;
        }

        const selectEl = document.getElementById("month-selector");
        selectEl.innerHTML = sortedMonths
          .map(mk => `<option value="${escapeHtml(mk)}" ${mk === selectedMonthKey ? "selected" : ""}>${escapeHtml(formatMonthVN(mk))}</option>`)
          .join("");

        const todayOrders = list.filter(o => getDateKey((o.createdAt || o.completedAt) || now) === todayKey);
        const monthOrders = list.filter(o => getMonthKey((o.createdAt || o.completedAt) || now) === selectedMonthKey);

        const todayTotal = todayOrders.reduce((sum, o) => sum + (Number(o.total) || 0), 0);
        const monthTotal = monthOrders.reduce((sum, o) => sum + (Number(o.total) || 0), 0);

        document.getElementById("rev-today-label").textContent = `Doanh thu hôm nay (${formatDateVN(todayKey)})`;
        document.getElementById("rev-today-amount").textContent = `${todayTotal.toLocaleString("vi-VN")}đ`;
        document.getElementById("rev-today-count").textContent = `${todayOrders.length} đơn`;

        document.getElementById("rev-month-label").textContent = `Doanh thu ${formatMonthVN(selectedMonthKey)}`;
        document.getElementById("rev-month-amount").textContent = `${monthTotal.toLocaleString("vi-VN")}đ`;
        document.getElementById("rev-month-count").textContent = `${monthOrders.length} đơn`;
      }

      function renderOrderCard(o) {
        const isDone = o.status === "done";
        const isUnackedNew = !isDone && !isOrderAcked(o);
        const tableText = escapeHtml(o.table || "Mang về");
        const modeText = o.orderType ? `<span class="mode-tag">${escapeHtml(o.orderType)}</span>` : "";
        const timeText = o.createdAt
          ? new Date(Number(o.createdAt)).toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit" })
          : "";

        const itemsHtml = (Array.isArray(o.items) ? o.items : []).map(i => `

        return `

                  <strong style="font-size:18px;">Bàn: ${tableText}</strong>

                  <span class="badge">${isDone ? "ĐÃ XONG" : "ĐƠN MỚI"}</span>
                  ${isUnackedNew ? `<span class="badge unacked-badge">CHƯA XÁC NHẬN</span>` : ""}
                </div>
              </div>
              ${timeText ? `<div style="font-size:12px; color:#94a3b8; margin-top:4px;">Lúc ${timeText}</div>` : ""}
              <ul style="padding-left:18px; margin:10px 0;">

              </ul>
              ${o.note ? `<div class="order-note">Ghi chú đơn: ${escapeHtml(o.note)}</div>` : ""}
            </div>

            <div>
              <div style="font-weight:bold;">Tổng: ${(Number(o.total) || 0).toLocaleString("vi-VN")}đ</div>
              <div class="actions">
                ${isDone
                  ? `<button type="button" class="btn-undo" data-action="status" data-id="${escapeHtml(o.id)}" data-status="new">↩ Khôi phục lại đơn mới</button>`
                  : `
                    ${isUnackedNew
                      ? `<button type="button" class="btn-ack" data-action="ack" data-id="${escapeHtml(o.id)}">🔔 Xác nhận đơn mới</button>`
                      : ""
                    }
                    <button type="button" class="btn-done" data-action="status" data-id="${escapeHtml(o.id)}" data-status="done">✔ Hoàn tất</button>
                  `
                }
              </div>
            </div>
          </div>
        `;
      }

      function renderAll() {
        const todayKey = getDateKeyByOffset(0);
        document.getElementById("today-label").textContent =
          `Hôm nay: ${formatDateVN(todayKey)} — Tự động chuyển sang thư mục ngày sau 00:00`;

        const list = Array.from(latestOrdersMap.values())
          .sort((a, b) => (Number(b.createdAt) || 0) - (Number(a.createdAt) || 0));

        renderRevenue(list);

        const todayOrders = list.filter(o => getDateKey(o.createdAt || o.completedAt || Date.now()) === todayKey);
        const newOrders = todayOrders.filter(o => o.status !== "done");
        const doneOrders = todayOrders.filter(o => o.status === "done");

        document.getElementById("new-count").textContent = newOrders.length;
        document.getElementById("done-count").textContent = doneOrders.length;

        document.getElementById("new-orders-grid").innerHTML = newOrders.length
          ? newOrders.map(renderOrderCard).join("")
          : `<div class="empty-msg">Hiện không có đơn mới nào hôm nay.</div>`;

        document.getElementById("done-orders-grid").innerHTML = doneOrders.length
          ? doneOrders.map(renderOrderCard).join("")
          : `<div class="empty-msg">Chưa có đơn nào hoàn tất hôm nay.</div>`;

        const archiveOrders = list.filter(o => getDateKey(o.createdAt || o.completedAt || Date.now()) !== todayKey);
        const groupedByDay = new Map();

        for (const order of archiveOrders) {
          const dKey = getDateKey(order.createdAt || order.completedAt || Date.now());
          if (!groupedByDay.has(dKey)) groupedByDay.set(dKey, []);
          groupedByDay.get(dKey).push(order);
        }

        for (const customKey of customFolders) {
          if (customKey !== todayKey && !groupedByDay.has(customKey)) {
            groupedByDay.set(customKey, []);
          }
        }

        const sortedDays = Array.from(groupedByDay.keys()).sort((a, b) => b.localeCompare(a));
        document.getElementById("archive-days-count").textContent = `${sortedDays.length} ngày`;

        const archiveContainer = document.getElementById("archive-days-container");
        archiveContainer.innerHTML = sortedDays.map(dateKey => {
          const dayList = groupedByDay.get(dateKey) || [];
          const dayTotal = dayList.reduce((sum, item) => sum + (Number(item.total) || 0), 0);
          const isOpen = expandedDays.has(dateKey);

          return `
            <div class="day-folder" data-date="${escapeHtml(dateKey)}">
              <div class="day-header" data-action="toggle-day" data-date="${escapeHtml(dateKey)}">
                <div class="day-title">
                  <span class="day-title-text">📅 Ngày ${formatDateVN(dateKey)}</span>
                  <span class="day-meta">(${dayList.length} đơn • Tổng: ${dayTotal.toLocaleString("vi-VN")}đ)</span>
                </div>
                <div class="day-controls">
                  <button type="button" class="btn-toggle" data-action="toggle-day" data-date="${escapeHtml(dateKey)}">
                    ${isOpen ? "▲ Thu gọn" : "▼ Xem đơn"}
                  </button>
                  <button type="button" class="btn-delete-day" data-action="delete-day" data-date="${escapeHtml(dateKey)}">
                    🗑 Xóa ngày này
                  </button>
                </div>
              </div>
              <div class="grid day-orders ${isOpen ? "is-open" : ""}">
                ${dayList.length
                  ? dayList.map(renderOrderCard).join("")
                  : `<div class="empty-msg">Chưa có đơn nào trong thư mục ngày ${formatDateVN(dateKey)}.</div>`
                }
              </div>
            </div>
          `;
        }).join("");

        syncAlertLoop();
      }

      customFolders.add(getDateKeyByOffset(-1));
      customFolders.add(getDateKeyByOffset(-2));
      renderAll();
      renderStaffCalls();

      document.getElementById("month-selector").addEventListener("change", (e) => {
        selectedMonthKey = e.target.value;
        renderAll();
      });

      document.getElementById("btn-revenue").addEventListener("click", () => {
        const revBox = document.getElementById("revenue-section");
        if (revenueUnlocked) {
          revBox.classList.toggle("unlocked");
          return;
        }
        const pin = prompt("Nhập mật khẩu để xem mục Doanh thu:");
        if (pin === null) return;
        if (pin.trim() === REVENUE_PIN) {
          revenueUnlocked = true;
          revBox.classList.add("unlocked");
          renderAll();
        } else {
          alert("Mật khẩu không đúng!");
        }
      });

      document.getElementById("btn-lock-revenue").addEventListener("click", () => {
        revenueUnlocked = false;
        document.getElementById("revenue-section").classList.remove("unlocked");
      });

      soundBtn.addEventListener("click", () => {
        soundEnabled = !soundEnabled;
        soundBtn.classList.toggle("active", soundEnabled);
        soundBtn.textContent = soundEnabled ? "🔔 Chuông báo: ĐANG BẬT" : "🔔 Bật chuông báo đơn";
        if (soundEnabled) {
          playChime();
          syncAlertLoop();
        } else {
          stopAlertLoop();
        }
      });

      muteBtn.addEventListener("click", () => {
        stopAlertLoop();
      });

      document.getElementById("btn-add-folder").addEventListener("click", () => {
        const input = prompt("Nhập ngày muốn tạo thư mục (DD/MM/YYYY, ví dụ: 21/11/2026):");
        if (!input) return;
        const match = input.trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
        if (!match) {
          alert("Vui lòng nhập đúng định dạng DD/MM/YYYY (ví dụ: 21/11/2026).");
          return;
        }
        const day = String(match[1]).padStart(2, "0");
        const month = String(match[2]).padStart(2, "0");
        const year = match[3];
        const dateKey = `${year}-${month}-${day}`;
        customFolders.add(dateKey);
        expandedDays.add(dateKey);
        renderAll();
      });

      document.addEventListener("click", async (e) => {
        if (!unlocked) return;
        const target = e.target.closest("[data-action]");
        if (!target) return;

        const action = target.getAttribute("data-action");

        if (action === "resolve-call") {
          const callId = target.getAttribute("data-id");
          if (!callId) return;
          localResolvedCallIds.add(callId);
          saveSet(STORAGE_RESOLVED_CALLS_KEY, localResolvedCallIds);
          const currentCall = latestCallsMap.get(callId);
          if (currentCall) {
            latestCallsMap.set(callId, { ...currentCall, status: "resolved" });
          }
          renderStaffCalls();
          if (typeof window.__firebaseResolveCall === "function") {
            await window.__firebaseResolveCall(callId);
          }
          return;
        }

        if (action === "ack") {
          const orderId = target.getAttribute("data-id");
          if (!orderId) return;
          acknowledgedOrderIds.add(orderId);
          saveSet(STORAGE_ACK_KEY, acknowledgedOrderIds);
          const currentOrder = latestOrdersMap.get(orderId);
          if (currentOrder) {
            latestOrdersMap.set(orderId, { ...currentOrder, acked: true });
          }
          renderAll();
          if (typeof window.__firebaseUpdateOrder === "function") {
            window.__firebaseUpdateOrder(orderId, { acked: true });
          }
          return;
        }

        if (action === "toggle-day") {
          const dateKey = target.getAttribute("data-date");
          if (!dateKey) return;
          if (expandedDays.has(dateKey)) {
            expandedDays.delete(dateKey);
          } else {
            expandedDays.add(dateKey);
          }
          renderAll();
          return;
        }

        if (action === "delete-day") {
          e.stopPropagation();
          const dateKey = target.getAttribute("data-date");
          if (!dateKey) return;

          const label = formatDateVN(dateKey);
          const targetIds = Array.from(latestOrdersMap.values())
            .filter(val => getDateKey((val && (val.createdAt || val.completedAt)) || Date.now()) === dateKey)
            .map(val => val.id);

          if (!targetIds.length) {
            customFolders.delete(dateKey);
            expandedDays.delete(dateKey);
            renderAll();
            return;
          }

          const ok = confirm(`Xóa toàn bộ ${targetIds.length} đơn của ngày ${label}?`);
          if (!ok) return;

          if (typeof window.__firebaseDeleteOrders === "function") {
            await window.__firebaseDeleteOrders(targetIds);
          }
          for (const id of targetIds) {
            acknowledgedOrderIds.delete(id);
            latestOrdersMap.delete(id);
          }
          saveSet(STORAGE_ACK_KEY, acknowledgedOrderIds);
          customFolders.delete(dateKey);
          expandedDays.delete(dateKey);
          renderAll();
          return;
        }

        if (action === "status") {
          const orderId = target.getAttribute("data-id");
          const status = target.getAttribute("data-status");
          if (!orderId || !status) return;

          const payload = { status };
          if (status === "done") {
            acknowledgedOrderIds.add(orderId);
            saveSet(STORAGE_ACK_KEY, acknowledgedOrderIds);
            payload.acked = true;
            payload.completedAt = Date.now();
          } else if (status === "new") {
            acknowledgedOrderIds.delete(orderId);
            saveSet(STORAGE_ACK_KEY, acknowledgedOrderIds);
            payload.acked = false;
          }

          const currentOrder = latestOrdersMap.get(orderId);
          if (currentOrder) {
            latestOrdersMap.set(orderId, { ...currentOrder, ...payload });
          }
          renderAll();

          if (typeof window.__firebaseUpdateOrder === "function") {
            window.__firebaseUpdateOrder(orderId, payload);
          }
        }
      });

      window.__kitchenBridge = {
        setOrdersData(data) {
          const nextMap = new Map();
          Object.entries(data || {}).forEach(([id, val]) => {
            if (!id) return;
            const cleanId = String(id).trim();
            if (!cleanId) return;
            const merged = { ...(val || {}), id: cleanId };
            if (acknowledgedOrderIds.has(cleanId) && merged.acked !== false) {
              merged.acked = true;
            }
            nextMap.set(cleanId, merged);
          });
          latestOrdersMap = nextMap;
          renderAll();
        },
        setCallsData(calls) {
          const nextMap = new Map();
          Object.entries(calls || {}).forEach(([id, val]) => {
            if (!id) return;
            const cleanId = String(id).trim();
            if (!cleanId) return;
            const merged = { ...(val || {}), id: cleanId };
            if (localResolvedCallIds.has(cleanId)) {
              merged.status = "resolved";
            }
            nextMap.set(cleanId, merged);
          });
          latestCallsMap = nextMap;
          renderStaffCalls();
        },
        reportError(msg) {
          showError(msg);
        }
      };
    })();
  </script>

          status: "resolved",
          resolvedAt: Date.now()
        });
      };

      onValue(ref(db, "orders"), (snapshot) => {
        const data = snapshot.val() || {};
        const dedupedData = {};

        Object.entries(data).forEach(([rawId, val]) => {
          const id = String(rawId || "").trim();
          if (!id || dedupedData[id]) return;
          dedupedData[id] = { ...(val || {}), id };
        });

        if (window.__kitchenBridge) {
          window.__kitchenBridge.setOrdersData(dedupedData);
        }
      }, (err) => {
        if (window.__kitchenBridge) {
          window.__kitchenBridge.reportError("Lỗi đọc dữ liệu đơn hàng: " + err.message);
        }
      });

      onValue(ref(db, "staffCalls"), (snapshot) => {
        const calls = snapshot.val() || {};
        const dedupedCalls = {};

        Object.entries(calls).forEach(([rawId, val]) => {
          const id = String(rawId || "").trim();
          if (!id || dedupedCalls[id]) return;
          dedupedCalls[id] = { ...(val || {}), id };
        });

        if (window.__kitchenBridge) {
          window.__kitchenBridge.setCallsData(dedupedCalls);
        }
      }, (err) => {
        if (window.__kitchenBridge) {
          window.__kitchenBridge.reportError("Lỗi đọc dữ liệu gọi nhân viên: " + err.message);
        }
      });
    } catch (err) {
      if (window.__kitchenBridge) {
        window.__kitchenBridge.reportError("Lỗi khởi tạo Firebase: " + (err && err.message ? err.message : String(err)));
      }
    }
  </script>
</body>
</html>
