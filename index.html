<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test Menu Gọi Món</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; margin: 0; padding: 14px 14px 230px; background: #f4f5f7; color: #111827; }
    .header { background: #111827; color: #fff; padding: 14px 16px; border-radius: 12px; margin-bottom: 12px; }
    .tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
    .tab-btn { padding: 9px 6px; border: 1px solid #d1d5db; border-radius: 8px; background: #fff; font-weight: 700; cursor: pointer; }
    .tab-btn.active { background: #111827; color: #fff; border-color: #111827; }
    .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .left { display: flex; align-items: center; gap: 10px; }
    .thumb { width: 64px; height: 64px; border-radius: 10px; object-fit: cover; background: #e5e7eb; flex-shrink: 0; }
    .name { font-weight: 700; font-size: 15px; }
    .price { color: #16a34a; font-weight: 700; font-size: 14px; margin-top: 4px; }
    .qty-box { display: flex; align-items: center; gap: 8px; }
    .btn-q { width: 42px; height: 42px; font-size: 22px; font-weight: 800; border: 1.5px solid #9ca3af; border-radius: 10px; background: #f9fafb; cursor: pointer; }
    .qty { min-width: 28px; text-align: center; font-size: 20px; font-weight: 900; }
    .bottom { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 2px solid #111827; padding: 12px 14px; }
    .mode-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    .mode-btn { padding: 10px; border: 2px solid #cbd5e1; border-radius: 8px; background: #fff; font-weight: 800; cursor: pointer; }
    .mode-btn.active { background: #111827; color: #fff; border-color: #111827; }
    .table-sel { width: 100%; padding: 10px; font-size: 16px; font-weight: 700; border-radius: 8px; border: 2px solid #111827; margin-bottom: 10px; display: none; }
    .table-sel.show { display: block; }
    .bar { display: flex; justify-content: space-between; align-items: center; background: #111827; color: #fff; padding: 12px 14px; border-radius: 10px; }
    .send-btn { background: #16a34a; color: #fff; border: none; border-radius: 10px; padding: 12px 22px; font-size: 19px; font-weight: 900; cursor: pointer; }
  </style>
</head>
<body>
  <div class="header">
    <div style="font-size:12px;opacity:.75;">MENU GỌI MÓN</div>
    <h2 id="title" style="margin:4px 0 0;">Kính chào quý khách</h2>
  </div>

  <div class="tabs">
    <button type="button" class="tab-btn active" data-cat="all">Tất cả</button>
    <button type="button" class="tab-btn" data-cat="Đồ uống">Đồ uống</button>
    <button type="button" class="tab-btn" data-cat="Đồ ăn">Đồ ăn</button>
    <button type="button" class="tab-btn" data-cat="Mì cay">Mì cay</button>
  </div>

  <div id="list"></div>

  <div class="bottom">
    <div class="mode-row">
      <button type="button" id="m-dine" class="mode-btn">TẠI QUÁN</button>
      <button type="button" id="m-take" class="mode-btn">MANG VỀ</button>
    </div>
    <select id="table-sel" class="table-sel">
      <option value="">-- Chọn bàn (1 - 10) --</option>
      <option value="1">Bàn 1</option><option value="2">Bàn 2</option><option value="3">Bàn 3</option>
      <option value="4">Bàn 4</option><option value="5">Bàn 5</option><option value="6">Bàn 6</option>
      <option value="7">Bàn 7</option><option value="8">Bàn 8</option><option value="9">Bàn 9</option>
      <option value="10">Bàn 10</option>
    </select>
    <div class="bar">
      <span id="summary" style="font-weight:800;font-size:16px;">0 món - 0đ</span>
      <button type="button" id="send-btn" class="send-btn">Gửi đơn</button>
    </div>
  </div>

  <script>
    const FALLBACK = "data:image/svg+xml;utf8," + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" fill="#e5e7eb"/><text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle" font-family="Arial" font-size="13" fill="#374151">MON</text></svg>'
    );

    const ITEMS = [
      { id: 1, cat: "Đồ uống", name: "Cà phê đen đá", price: 20000, img: "https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?auto=format&fit=crop&w=200&q=70" },
      { id: 2, cat: "Đồ uống", name: "Cà phê sữa đá", price: 25000, img: "https://images.unsplash.com/photo-1572442388796-11668a67e53d?auto=format&fit=crop&w=200&q=70" },
      { id: 3, cat: "Đồ ăn", name: "Khoai tây chiên", price: 30000, img: "https://images.unsplash.com/photo-1573080496219-bb080dd4f877?auto=format&fit=crop&w=200&q=70" },
      { id: 4, cat: "Đồ ăn", name: "Gà viên chiên giòn", price: 35000, img: "https://images.unsplash.com/photo-1562967914-608f82629710?auto=format&fit=crop&w=200&q=70" },
      { id: 5, cat: "Mì cay", name: "Mì cay bò mỹ", price: 45000, img: "https://images.unsplash.com/photo-1569718212165-3a8278d5f624?auto=format&fit=crop&w=200&q=70" },
      { id: 6, cat: "Mì cay", name: "Mì cay hải sản", price: 48000, img: "https://images.unsplash.com/photo-1617093727343-374698b1b08d?auto=format&fit=crop&w=200&q=70" }
    ];

    const cart = {};
    let activeCat = "all";
    let mode = "";

    function render() {
      const filtered = activeCat === "all" ? ITEMS : ITEMS.filter(x => x.cat === activeCat);
      document.getElementById("list").innerHTML = filtered.map(x => `
        <div class="card">
          <div class="left">
            <img class="thumb" src="${x.img}" alt="${x.name}" onerror="this.onerror=null;this.src='${FALLBACK}'" />
            <div>
              <div class="name">${x.name}</div>
              <div class="price">${x.price.toLocaleString("vi-VN")}đ</div>
            </div>
          </div>
          <div class="qty-box">
            <button type="button" class="btn-q" data-delta="-1" data-id="${x.id}">-</button>
            <span class="qty">${cart[x.id] || 0}</span>
            <button type="button" class="btn-q" data-delta="1" data-id="${x.id}">+</button>
          </div>
        </div>
      `).join("");

      let q = 0, p = 0;
      for (const [id, c] of Object.entries(cart)) {
        const it = ITEMS.find(m => m.id === Number(id));
        if (it) { q += c; p += it.price * c; }
      }
      document.getElementById("summary").textContent = `${q} món - ${p.toLocaleString("vi-VN")}đ`;
    }

    document.querySelectorAll(".tab-btn").forEach(b => {
      b.addEventListener("click", () => {
        activeCat = b.dataset.cat;
        document.querySelectorAll(".tab-btn").forEach(t => t.classList.toggle("active", t === b));
        render();
      });
    });

    document.getElementById("list").addEventListener("click", e => {
      const btn = e.target.closest(".btn-q");
      if (!btn) return;
      const id = Number(btn.dataset.id);
      const next = (cart[id] || 0) + Number(btn.dataset.delta);
      if (next <= 0) delete cart[id]; else cart[id] = next;
      render();
    });

    document.getElementById("m-dine").addEventListener("click", () => {
      mode = "dine";
      document.getElementById("m-dine").classList.add("active");
      document.getElementById("m-take").classList.remove("active");
      document.getElementById("table-sel").classList.add("show");
      document.getElementById("title").textContent = "Tại quán";
    });

    document.getElementById("m-take").addEventListener("click", () => {
      mode = "take";
      document.getElementById("m-take").classList.add("active");
      document.getElementById("m-dine").classList.remove("active");
      document.getElementById("table-sel").classList.remove("show");
      document.getElementById("title").textContent = "Mang về";
    });

    document.getElementById("send-btn").addEventListener("click", () => {
      if (!mode) return alert("Hãy chọn TẠI QUÁN hoặc MANG VỀ trước!");
      const tbl = document.getElementById("table-sel").value;
      if (mode === "dine" && !tbl) return alert("Hãy chọn số bàn!");
      const totalItems = Object.values(cart).reduce((a, b) => a + b, 0);
      if (!totalItems) return alert("Hãy chọn ít nhất 1 món!");
      alert("Đã kiểm tra giao diện thành công (" + totalItems + " món).");
    });

    render();
  </script>
</body>
</html>
